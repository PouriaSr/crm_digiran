<style>
/* Shared compact rows for reception, cases, registration and hiring. */
.workflow-hub { --wf-border:#e6eaf0; --wf-muted:#64748b; --wf-blue:#2563eb; }
.wf-tabs-shell { margin-bottom:20px; padding:6px; background:#fff; border:1px solid var(--wf-border); border-radius:16px; }
.wf-tabs { display:flex; gap:4px; overflow-x:auto; scrollbar-width:thin; scroll-padding-inline:12px; }
.wf-tab { display:inline-flex; align-items:center; justify-content:center; gap:8px; flex-shrink:0; padding:11px 15px; border-radius:11px; color:#64748b; font-size:13px; font-weight:700; white-space:nowrap; transition:background .15s,color .15s; }
.wf-tab:hover { background:#f1f5f9; color:#334155; }
.wf-tab[aria-current="page"] { background:#eff6ff; color:#1d4ed8; box-shadow:inset 0 -2px #2563eb; }
.wf-tab:focus-visible,.wf-summary:focus-visible { outline:2px solid #2563eb; outline-offset:-2px; }
.wf-tab[disabled] { color:#94a3b8; cursor:not-allowed; }
.wf-tab-count { font-size:11px; min-width:21px; padding:1px 6px; background:#f1f5f9; color:#64748b; border-radius:7px; text-align:center; }
.wf-tab[aria-current="page"] .wf-tab-count { background:#dbeafe; color:#1d4ed8; }
.wf-tab svg { width:18px; height:18px; flex-shrink:0; }
.wf-panel { background:#fff; border:1px solid var(--wf-border); border-radius:16px; overflow:hidden; }
.wf-panel-head { padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; border-bottom:1px solid #f1f5f9; }
.wf-title { font-size:15px; font-weight:800; color:#1e293b; }
.wf-subtitle { font-size:12px; color:var(--wf-muted); margin-top:5px; line-height:1.8; }
.wf-panel-body { padding:18px; }
.wf-arrival-fields { display:grid; grid-template-columns:minmax(210px,1.15fr) minmax(280px,1fr) auto; align-items:end; gap:16px; }
.wf-label { display:block; font-size:12px; font-weight:700; color:#475569; margin-bottom:8px; }
.wf-choice { display:flex; align-items:center; justify-content:center; gap:8px; padding:11px 14px; border:1px solid #e2e8f0; border-radius:10px; cursor:pointer; font-size:13px; }
.wf-choice:has(input:checked) { border-color:#10b981; background:#ecfdf5; color:#047857; }
.wf-choice input { accent-color:#059669; }
.wf-list { container-type:inline-size; }
.wf-list-head { display:none; }
.wf-record { border-bottom:1px solid #eef2f6; }
.wf-record:last-child { border-bottom:0; }
.wf-summary { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 12px; align-items:center; padding:14px 16px; cursor:pointer; list-style:none; color:#334155; font-size:12px; }
.wf-summary::-webkit-details-marker { display:none; }
.wf-summary:hover { background:#f8fafc; }
.wf-record[open]>.wf-summary { background:#f0f7ff; }
.wf-summary>* { min-width:0; }
.wf-name { grid-column:1; grid-row:1; font-weight:800; font-size:13px; color:#1e293b; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wf-mobile { grid-column:1; grid-row:2; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
.wf-state { grid-column:2; grid-row:1; text-align:left; white-space:nowrap; }
.wf-time { grid-column:1; grid-row:3; font-size:11px; color:#64748b; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wf-time::before { content:attr(data-label) ' '; }
.wf-metric { grid-column:2; grid-row:2; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wf-timer { font-variant-numeric:tabular-nums; font-weight:800; font-size:13px; letter-spacing:.03em; }
.wf-owner { display:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wf-actions { grid-column:2; grid-row:3; display:flex; align-items:center; justify-content:flex-end; gap:8px; white-space:nowrap; }
.wf-details-label { display:inline-flex; gap:4px; align-items:center; color:#64748b; font-size:11px; }
.wf-caret { width:14px; height:14px; transition:transform .15s; }
.wf-record[open]>.wf-summary .wf-caret { transform:rotate(180deg); }
.wf-action { display:inline-flex; align-items:center; justify-content:center; gap:5px; padding:7px 11px; border-radius:8px; font-size:11px; font-weight:700; background:#eff6ff; border:1px solid #dbeafe; color:#1d4ed8; line-height:1.5; }
.wf-action:hover { background:#dbeafe; }
.wf-primary { background:#2563eb; color:#fff; border-color:#2563eb; }
.wf-primary:hover { background:#1d4ed8; }
.wf-badge { display:inline-flex; align-items:center; gap:5px; padding:4px 7px; border-radius:6px; font-size:10px; font-weight:700; }
.wf-badge-wait { background:#fff7ed; color:#c2410c; }
.wf-badge-done { background:#ecfdf5; color:#047857; }
.wf-badge-neutral { background:#f1f5f9; color:#64748b; }
.wf-badge-hiring { background:#f5f3ff; color:#6d28d9; }
.wf-details { padding:16px; border-top:1px solid #e2e8f0; background:#f8fafc; }
.wf-detail-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr)); gap:12px; }
.wf-detail-card { border:1px solid #e2e8f0; border-radius:12px; padding:14px; background:#fff; min-width:0; font-size:12px; }
.wf-detail-title { font-weight:800; color:#334155; font-size:12px; margin-bottom:12px; }
.wf-detail-card dl { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:baseline; gap:9px 12px; }
.wf-detail-card dt { color:#94a3b8; }
.wf-detail-card dd { color:#334155; overflow-wrap:anywhere; }
.wf-detail-note { padding-top:12px; margin-top:12px; border-top:1px dashed #e2e8f0; color:#475569; white-space:pre-line; overflow-wrap:anywhere; line-height:1.9; }
.wf-search { display:flex; align-items:center; gap:8px; width:min(100%,310px); }
.wf-search input { min-width:0; width:100%; border:1px solid #e2e8f0; border-radius:9px; padding:8px 11px; font-size:12px; background:#f8fafc; }
.wf-search input:focus { outline:2px solid #bfdbfe; background:#fff; }
.wf-empty { padding:35px 18px; color:#94a3b8; font-size:13px; text-align:center; }
.wf-picker { display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding:16px 18px; }
.wf-picker>form,.wf-picker>div { flex:1; min-width:210px; }
.wf-picker .wf-label { margin:0; }
.wf-editor { border:1px solid var(--wf-border); border-radius:16px; background:white; overflow:hidden; margin-bottom:20px; }
.wf-editor>summary { cursor:pointer; padding:16px 18px; font-size:13px; font-weight:800; color:#4338ca; }
.wf-editor-content { border-top:1px solid #eef2f6; padding:16px; }
.wf-referral-dialog { margin:auto; border:0; border-radius:18px; padding:0; width:min(440px,calc(100% - 32px)); box-shadow:0 24px 80px #0f172a33; color:#334155; }
.wf-referral-dialog::backdrop { background:#0f172a88; backdrop-filter:blur(3px); }
.wf-referral-dialog form { padding:22px; }
.wf-referral-dialog select { width:100%; border:1px solid #cbd5e1; border-radius:10px; padding:11px; font-size:13px; margin-top:10px; background:#fff; }
@container (min-width:980px) {
    .wf-summary,.wf-list-head { display:grid; grid-template-columns:minmax(130px,1.25fr) 108px 120px 125px 96px minmax(90px,.85fr) 168px; gap:10px; align-items:center; padding-inline:16px; }
    .wf-summary { min-height:68px; padding-block:13px; }
    .wf-summary>* { grid-column:auto; grid-row:auto; }
    .wf-owner { display:block; }
    .wf-mobile,.wf-state,.wf-time,.wf-metric { text-align:right; }
    .wf-time::before { content:none; }
    .wf-list-head { padding-block:10px; background:#f8fafc; color:#94a3b8; font-size:11px; border-bottom:1px solid #eef2f6; }
}
@media (max-width:900px) {
    .wf-arrival-fields { grid-template-columns:1fr; gap:18px; }
    .wf-arrival-fields>.wf-action { justify-self:start; }
}
@media (prefers-reduced-motion:reduce) { .wf-tab,.wf-caret { transition:none; } }
/* Customer hub column alignment: names right, remaining columns centered. */
.workflow-hub table th,.workflow-hub table td { text-align:center !important; }
.workflow-hub table .hub-name-column { text-align:right !important; }
.wf-summary>.wf-name,.wf-list-head>:first-child { text-align:right; }
.wf-summary>:not(.wf-name),.wf-list-head>:not(:first-child) { text-align:center; }
.wf-summary>.wf-actions { justify-content:center; }
.workflow-hub tr[hidden] { display:none !important; }
/* Readable detail panels; primary row alignment remains separate. */
.wf-expanded { padding:20px; background:#f5f7fb; text-align:right; }
.wf-expanded-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:18px; }
.wf-eyebrow { font-size:11px; color:#64748b; margin-bottom:5px; }
.wf-expanded-header h3 { color:#0f172a; font-size:16px; font-weight:800; }
.wf-contact-line { display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin-top:6px; color:#64748b; font-size:12px; }
.wf-info-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; align-items:start; }
.wf-info-section { min-width:0; border:1px solid #e2e8f0; border-radius:14px; background:#fff; padding:18px; }
.wf-section-heading { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:6px 12px; border-bottom:1px solid #e8edf4; padding-bottom:12px; margin-bottom:4px; }
.wf-section-heading h4 { color:#1e293b; font-size:13px; font-weight:800; }
.wf-section-heading>span,.wf-section-heading>time { color:#64748b; font-size:11px; }
.wf-fields,.wf-detail-card dl.wf-fields { display:block; margin:0; font-size:12px; line-height:1.9; text-align:right; }
.wf-fields>div { display:grid; grid-template-columns:minmax(95px,.85fr) minmax(0,1.3fr); align-items:baseline; gap:8px 16px; padding:11px 0; border-bottom:1px solid #f1f5f9; }
.wf-fields>div:last-child { border-bottom:0; padding-bottom:0; }
.wf-fields dt { color:#64748b; font-weight:400; }
.wf-fields dd { margin:0; color:#1e293b; font-weight:600; min-width:0; overflow-wrap:anywhere; }
.wf-fields bdi,.wf-contact-line bdi,.wf-journey bdi { font-variant-numeric:tabular-nums; }
.wf-field-long dd { white-space:pre-line; line-height:2; }
.wf-unset { color:#94a3b8; font-size:11px; font-weight:400; }
.wf-credit-rank { display:inline-block; padding:1px 10px; border-radius:6px; background:#eff6ff; color:#1d4ed8; }
.wf-note-box { margin-top:16px; padding:14px 15px; background:#f8fafc; border:1px solid #e8edf4; border-radius:10px; text-align:right; }
.wf-note-box h5 { color:#64748b; font-size:11px; font-weight:700; margin-bottom:7px; }
.wf-note-box p { margin:0; color:#334155; font-size:13px; line-height:2; white-space:pre-wrap; overflow-wrap:anywhere; }
.wf-journey { padding:8px 0 0; margin:0; list-style:none; font-size:12px; }
.wf-journey>li { position:relative; padding:10px 23px 18px 0; margin:0 6px 0 0; border-right:2px solid #e2e8f0; }
.wf-journey>li:last-child { padding-bottom:3px; border-right-color:transparent; }
.wf-journey>li::before { content:''; position:absolute; top:14px; right:-7px; width:12px; height:12px; border:2px solid #cbd5e1; border-radius:50%; background:#fff; }
.wf-journey>li.is-complete::before { background:#10b981; border-color:#10b981; box-shadow:0 0 0 3px #ecfdf5; }
.wf-journey>li.is-current::before { border-color:#f59e0b; box-shadow:0 0 0 3px #fffbeb; }
.wf-journey-heading { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px 10px; }
.wf-journey-heading h5 { font-weight:700; color:#334155; }
.wf-journey-heading time { font-size:11px; color:#64748b; }
.wf-journey p { margin-top:6px; color:#64748b; line-height:1.9; overflow-wrap:anywhere; }
.wf-duration { display:inline-flex; flex-wrap:wrap; gap:7px; margin-inline-start:10px; color:#047857; }
.wf-audit-panel { margin-top:16px; background:#fff; border:1px solid #e2e8f0; border-radius:12px; text-align:right; font-size:12px; }
.wf-audit-panel>summary { padding:14px 16px; cursor:pointer; color:#334155; font-weight:700; }
.wf-audit-hint { margin-inline-start:10px; color:#64748b; font-size:11px; font-weight:400; }
.wf-audit-list { list-style:none; padding:0 16px 16px; margin:0; }
.wf-audit-list>li { border-top:1px solid #e2e8f0; padding-top:13px; margin-top:12px; }
.wf-audit-list header { display:flex; flex-wrap:wrap; gap:8px 16px; color:#64748b; font-size:11px; margin-bottom:10px; }
.wf-audit-list dl>div { display:grid; grid-template-columns:110px minmax(0,1fr); gap:10px; padding:6px 0; }
.wf-audit-list dt { color:#475569; }
.wf-audit-list dd { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; overflow-wrap:anywhere; }
.wf-change-old,.wf-change-new { display:block; padding:8px 10px; border-radius:8px; line-height:1.9; }
.wf-change-old { background:#f8fafc; color:#64748b; }
.wf-change-new { background:#ecfdf5; color:#047857; }
.wf-change-label { display:block; font-size:10px; opacity:.8; margin-bottom:2px; }
.wf-call-history { display:grid; gap:12px; }
.wf-call-card { background:#fff; border:1px solid #e2e8f0; border-radius:13px; padding:16px; text-align:right; min-width:0; }
.wf-call-heading { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; }
.wf-call-heading>div { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.wf-call-heading time { font-size:11px; color:#64748b; }
.wf-call-facts { display:flex; flex-wrap:wrap; gap:8px 24px; font-size:12px; margin-top:14px; }
.wf-call-facts dt { color:#64748b; font-size:11px; margin-bottom:4px; }
.wf-call-facts dd { color:#334155; font-weight:600; }
.wf-call-footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; border-top:1px solid #eef2f6; margin-top:14px; padding-top:12px; color:#64748b; font-size:11px; }
@media (max-width:700px) {
 .wf-expanded { padding:14px 10px; }
 .wf-info-grid { grid-template-columns:minmax(0,1fr); gap:12px; }
 .wf-info-section { padding:15px; }
 .wf-fields>div { grid-template-columns:minmax(90px,.8fr) minmax(0,1.2fr); gap:8px 10px; }
 .wf-expanded-header h3 { font-size:15px; }
 .wf-audit-list dl>div { grid-template-columns:minmax(0,1fr); gap:4px; }
 .wf-call-card { padding:14px; }
}
.wf-next-step {background:#eff6ff;border:1px solid #dbeafe;border-radius:12px;padding:14px 16px;margin:0 0 18px;color:#1e40af;font-size:12px;line-height:1.9}.wf-next-step strong{display:block;font-size:12px;margin-bottom:4px}.wf-detail-accordion>summary{cursor:pointer;list-style:none;margin-bottom:0}.wf-detail-accordion>summary:after{content:'⌄';color:#64748b;margin-inline-start:auto}.wf-detail-accordion[open]>summary{margin-bottom:14px}.wf-detail-accordion[open]>summary:after{content:'⌃'}.wf-detail-accordion>summary>span{font-size:10px}
.wf-call-next{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px 12px;margin-top:10px;border-radius:9px;background:#f0f9ff;color:#075985;font-size:11px}.wf-note-box>summary{font-size:12px;color:#475569}
</style>
