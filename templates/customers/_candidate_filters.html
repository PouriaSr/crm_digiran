{% load fa_numbers %}
<style>
@media(max-width:639px){#hub-filter-form.candidate-filters.crm-filter-toolbar{flex-wrap:wrap!important}#hub-filter-form.candidate-filters>.crm-filter-track{flex-basis:100%;width:100%!important}#hub-filter-form.candidate-filters>.crm-filter-actions{margin:0!important}}
</style>
<form method="get" id="hub-filter-form" class="candidate-filters crm-filter-form bg-white rounded-2xl border border-slate-200 p-4 mb-4 flex gap-3 text-xs"><input type="hidden" name="tab" value="info"><input type="hidden" name="people" value="candidates"><input type="hidden" name="q" value="{{ search }}"><label>نمایش و بازه<select name="display_mode" class="no-search"><option value="recent" {% if table_filters.display_mode == 'recent' %}selected{% endif %}>جدیدترین ثبت</option><option value="oldest" {% if table_filters.display_mode == 'oldest' %}selected{% endif %}>قدیمی‌ترین ثبت</option></select></label><label>از تاریخ ثبت<input name="date_from" value="{{ table_filters.date_from }}" data-jdp placeholder="انتخاب تاریخ…"></label><label>تا تاریخ ثبت<input name="date_to" value="{{ table_filters.date_to }}" data-jdp placeholder="انتخاب تاریخ…"></label><label>وضعیت پذیرش<select name="visit"><option value="">همه وضعیت‌ها</option><option value="registered" {% if table_filters.visit == 'registered' %}selected{% endif %}>در انتظار پذیرش</option><option value="admitted" {% if table_filters.visit == 'admitted' %}selected{% endif %}>پذیرش‌شده، بدون ارجاع</option><option value="referred" {% if table_filters.visit == 'referred' %}selected{% endif %}>ارجاع‌شده به استخدام</option></select></label><label>کاربر مسئول<select name="contact_expert"><option value="">همه مسئولان</option><option value="unassigned" {% if table_filters.contact_expert == 'unassigned' %}selected{% endif %}>بدون مسئول</option>{% for expert in contact_experts %}<option value="{{ expert.pk }}" {% if table_filters.contact_expert == expert.pk|stringformat:'s' %}selected{% endif %}>{{ expert|user_label }}</option>{% endfor %}</select></label><button type="submit" class="bg-blue-600 text-white rounded-xl px-4 py-2">اعمال</button><a href="{% if 'customers.info' in user_permissions %}{% url 'customers:hub' %}?tab=info&amp;people=candidates{% else %}{% url 'customers:candidate_list' %}{% endif %}" class="border rounded-xl px-4 py-2">پاک‌کردن همه</a></form>
