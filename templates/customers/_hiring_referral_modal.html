<div id="hiring-modal" class="hr-overlay" role="dialog" aria-modal="true" aria-labelledby="hiring-refer-title"><section class="hr-dialog hr-dialog-small"><header class="hr-dialog-head"><h2 id="hiring-refer-title">ارجاع کارجو — {{ rec.customer.name }}</h2><button type="button" class="hr-close" data-close-hiring aria-label="بستن">×</button></header><form method="post" action="{% url 'customers:hiring_refer' rec.pk %}" data-hiring-form>{% csrf_token %}<div class="hr-dialog-body">{% if error %}<div class="hr-errors">{{ error }}</div>{% endif %}<label for="hiring-target">کاربر مسئول جدید</label><select id="hiring-target" name="user" required class="w-full border border-gray-200 rounded-xl px-3 py-3"><option value="">انتخاب کنید…</option>{% for person in users %}<option value="{{ person.pk }}">{{ person.get_full_name|default:person.username }}</option>{% endfor %}</select><label for="hiring-refer-note" class="mt-4">توضیح ارجاع (اختیاری)</label><textarea id="hiring-refer-note" name="note" rows="3" class="w-full border border-gray-200 rounded-xl px-3 py-3"></textarea><p class="text-sm text-gray-500 mt-3">ارجاع کارجو، زمان مصاحبه جدیدی شروع نمی‌کند.</p></div><footer class="hr-dialog-foot"><button type="submit" class="wf-action wf-primary">ارجاع</button><button type="button" class="wf-action" data-close-hiring>بستن</button></footer></form></section></div>
