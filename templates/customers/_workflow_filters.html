{% if workflow_filters and active_tab == filter_tab %}
<details class="wf-panel mb-5" {% if workflow_filters_active or workflow_filters.errors %}open{% endif %}><summary class="wf-panel-body text-sm font-bold text-gray-600 cursor-pointer">فیلتر مسئول، وضعیت و تاریخ‌های این مرحله</summary><form data-workflow-filters method="get" class="wf-panel-body border-t border-gray-100"><input type="hidden" name="tab" value="{{ active_tab }}"><input type="hidden" name="workflow_q" value="{{ workflow_query }}"><div class="hr-filter-grid">{% for field in workflow_filters %}<div><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><div class="hr-filter-actions"><button type="submit" class="wf-action wf-primary">اعمال فیلتر</button><a class="wf-action" href="?tab={{ active_tab }}">پاک‌کردن</a></div></form></details>
{% endif %}
