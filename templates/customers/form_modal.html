<div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4" id="new-customer-modal-backdrop">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
        <form hx-post="{% if form_action %}{{ form_action }}{% elif customer %}{% url 'customers:edit' customer.pk %}{% else %}{% url 'customers:create' %}{% endif %}?is_modal=1"
              hx-target="#new-customer-modal-backdrop"
              hx-swap="outerHTML"
              @change="if ($event.target.name === 'source') sourceVal = $event.target.value"
              class="p-6"
              x-data="{ sourceVal: '{{ form.source.value|default:'website'|escapejs }}' }">
            {% csrf_token %}
            <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
                <h3 class="text-lg font-bold text-gray-800">{{ title }}</h3>
                <button type="button" onclick="closeNewCustomerModal()" class="text-gray-400 hover:text-gray-600 bg-gray-50 hover:bg-gray-100 p-2 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            {{ form.non_field_errors }}
            <div class="space-y-4 text-sm">
                {% for field in form %}
                <div {% if field.name == 'ad_source' %}x-show="sourceVal === 'ads' || sourceVal === 'divar'" x-cloak style="display:none"{% endif %}>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}{% if field.field.required %} <span class="text-red-500">*</span>{% endif %}</label>
                    {{ field }}
                    {% if field.errors %}
                    <div class="text-red-500 text-xs mt-1 font-medium">{{ field.errors.0 }}</div>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
            <div class="mt-8 flex justify-end gap-3 pt-4 border-t border-gray-100">
                <button type="button" onclick="closeNewCustomerModal()" class="px-5 py-2.5 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 text-sm font-medium">انصراف</button>
                <button type="submit" class="px-5 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 text-sm font-medium shadow-sm">{{ submit_label }}</button>
            </div>
        </form>
    </div>
</div>
