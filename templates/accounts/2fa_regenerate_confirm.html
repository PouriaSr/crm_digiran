{% extends 'base.html' %}

{% block title %}تولید کدهای بازیابی جدید{% endblock %}

{% block content %}

<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">تولید کدهای بازیابی جدید</h1>

    <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-4 mb-6 text-sm text-yellow-800 flex items-start gap-3">
        <span class="text-lg flex-shrink-0">⚠️</span>
        <div>
            با این کار، <strong>کدهای بازیابی قبلی باطل می‌شوند</strong> و کدهای جدید ساخته می‌شن.
        </div>
    </div>

    <form data-crm-form method="post" class="flex gap-3">
        {% csrf_token %}
        <button type="submit"
                class="flex-1 px-5 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
            بله، کدهای جدید بساز
        </button>
        <a href="{% url 'hr:my_profile' %}"
           class="px-5 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 font-medium">
            انصراف
        </a>
    </form>
</div>

{% endblock %}
