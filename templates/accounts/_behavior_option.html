<div class="sb-item"><span class="sb-item-main"><strong>{{ option.label }}</strong></span><span class="sb-badge {% if not option.enabled %}sb-badge-gray{% endif %}">{{ option.enabled|yesno:'در فهرست انتخاب,کنارگذاشته‌شده' }}</span><div class="sb-actions"><a class="sb-btn sb-btn-small" href="{% if option.pk %}{% url 'accounts:behavior_option_edit' section.key field_name option.pk %}{% else %}{% url 'accounts:behavior_option_create' section.key field_name %}?key={{ option.key|urlencode }}{% endif %}">ویرایش</a><a class="sb-btn sb-btn-quiet sb-btn-small" href="{% url 'accounts:behavior_rule_create' section.key %}?source={{ field_name|urlencode }}&amp;value={{ option.key|urlencode }}">رفتار این گزینه</a></div></div>
