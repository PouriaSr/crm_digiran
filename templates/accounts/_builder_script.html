app.querySelectorAll('[data-builder-tab]').forEach(button=>{button.addEventListener('click',()=>{panel(button.dataset.builderTab);history.replaceState(null,'','#section-'+button.dataset.builderTab);});button.addEventListener('keydown',event=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(event.key))return;event.preventDefault();const tabs=[...app.querySelectorAll('[data-builder-tab]')];let index=tabs.indexOf(button);index=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowLeft'?1:-1)+tabs.length)%tabs.length;panel(tabs[index].dataset.builderTab,true);history.replaceState(null,'','#section-'+tabs[index].dataset.builderTab);});});
app.querySelector('[data-preview-edit]')?.addEventListener('click',event=>{editMode=!editMode;event.currentTarget.setAttribute('aria-pressed',String(editMode));event.currentTarget.textContent=editMode?'حالت انتخاب فعال؛ روی جزء بزنید':'انتخاب جزء برای ویرایش';root.classList.toggle('sb-edit-mode',editMode);});
root?.addEventListener('click',event=>{if(!editMode)return;const target=event.target.closest('[data-edit-url]');if(target?.dataset.editUrl){event.preventDefault();event.stopImmediatePropagation();location.assign(target.dataset.editUrl);}},true);
app.querySelectorAll('[data-preview-view]').forEach(button=>button.addEventListener('click',()=>{currentView=button.dataset.previewView;render();}));app.querySelectorAll('[data-preview-size]').forEach(button=>button.addEventListener('click',()=>{root?.classList.toggle('sb-phone',button.dataset.previewSize==='phone');for(const b of app.querySelectorAll('[data-preview-size]'))b.setAttribute('aria-pressed',String(b===button));}));app.querySelectorAll('[data-preview-toggle]').forEach(button=>button.addEventListener('click',event=>{const open=preview.hasAttribute('data-mobile-closed');preview.toggleAttribute('data-mobile-closed',!open);preview.toggleAttribute('data-mobile-open',open);for(const toggle of app.querySelectorAll('[data-preview-toggle]')){toggle.setAttribute('aria-expanded',String(open));toggle.lastElementChild.textContent=open?'بستن پیش‌نمایش':'پیش‌نمایش خروجی';}if(open)preview.scrollIntoView({behavior:'smooth',block:'start'});else form?.scrollIntoView({behavior:'smooth',block:'start'}); }));
// Local search keeps unrelated settings out of view and starts with a short list.
for(const group of app.querySelectorAll('[data-builder-search-group]')){const input=group.querySelector('[data-builder-search]'),items=[...group.querySelectorAll('[data-builder-search-item]')],more=group.querySelector('[data-builder-more]');let active='all',expanded=false;function filter(){const query=(input?.value||'').trim().toLocaleLowerCase('fa');let count=0;for(const item of items){const matches=(!query||item.textContent.toLocaleLowerCase('fa').includes(query))&&(active==='all'||item.dataset.category===active);item.hidden=!matches||(!expanded&&count>=12);if(matches)count++;}if(more)more.hidden=expanded||count<=12;const empty=group.querySelector('[data-search-empty]');if(empty)empty.hidden=count!==0;}
input?.addEventListener('input',()=>{expanded=true;filter();});more?.addEventListener('click',()=>{expanded=true;filter();});group.querySelectorAll('[data-builder-category]').forEach(button=>button.addEventListener('click',()=>{active=button.dataset.builderCategory;expanded=false;for(const b of group.querySelectorAll('[data-builder-category]'))b.setAttribute('aria-pressed',String(b===button));filter();}));filter();}
conditional();if(app.querySelector('[data-builder-panel]')){const hash=location.hash.replace('#section-','');panel(form?.querySelector('.crm-field-errors')?'settings':hash||app.dataset.initialPanel||'fields');}else{currentView=kind==='column'||kind==='component'&&base.component_kind==='column'?'columns':['stage','transition'].includes(kind)?'workflow':'fields';render();}
app.querySelectorAll('details').forEach(detail=>{if(detail.querySelector('.crm-field-errors'))detail.open=true;});
})();
</script>
