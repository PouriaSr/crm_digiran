{{ structure_list_payload|json_script:'structure-initial-payload' }}
<style>[data-structure-hidden-col]{display:none!important}.structure-mobile-values{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid #e2e8f0}.structure-mobile-values dt{font-size:11px;color:#64748b}.structure-mobile-values dd{font-size:13px;overflow-wrap:anywhere}.structure-mobile-values a{display:inline-flex;min-height:44px;align-items:center;color:#2563eb}.structure-cell{padding:12px;font-size:12px;vertical-align:middle}.structure-badge{display:inline-flex;border-radius:8px;background:#eff6ff;color:#1d4ed8;padding:4px 8px}.structure-button-primary{background:#2563eb!important;color:#fff!important;border-color:#2563eb!important}.structure-button-secondary{background:#f8fafc!important;color:#475569!important;border:1px solid #cbd5e1!important}.structure-button-danger{background:#dc2626!important;color:#fff!important;border-color:#dc2626!important}@media(max-width:767px){.structure-mobile-values{grid-template-columns:minmax(0,1fr)}}
</style><script>
(function(){'use strict';if(window.CRMStructure)return;
let payload={},queued=false;const rules=new Map(JSON.parse(document.getElementById('crm-interface-settings')?.textContent||'[]').map(item=>[item.key,item]));
function read(){const nodes=[...document.querySelectorAll('script[data-structure-payload]')];const node=nodes.at(-1)||document.getElementById('structure-initial-payload');try{const data=JSON.parse(node?.textContent||'{}');if(data.section)payload=data;}catch(_){}}
function value(text,column){if(column.choices&&Object.hasOwn(column.choices,String(text)))text=column.choices[String(text)];if(text===null||text===undefined||text==='')return '—';if(column.display==='number'||column.display==='money'){const n=Number(text);if(Number.isFinite(n))return new Intl.NumberFormat('fa-IR',{maximumFractionDigits:4}).format(n);}if(column.display==='date'){const date=new Date(String(text));if(Number.isFinite(date.valueOf()))return new Intl.DateTimeFormat('fa-IR').format(date);}if(typeof text==='boolean')return text?'بله':'خیر';return String(text);}
function fill(cell,row,column){const signature=JSON.stringify([row.values[column.key],column.source,column.display,row.url]);if(cell.dataset.structureSignature===signature)return;cell.dataset.structureSignature=signature;cell.replaceChildren();if(column.source==='system:record'){const a=document.createElement('a');a.href=row.url;a.className='text-blue-600 inline-flex items-center min-h-[44px]';a.textContent='اطلاعات و مراحل';cell.append(a);}else{const el=document.createElement(column.display==='badge'?'span':'span');if(column.display==='badge')el.className='structure-badge';el.textContent=value(row.values[column.key],column);cell.append(el);}}
function style(cell,column){cell.style.setProperty('text-align',column.align,'important');cell.style.width=column.width+'px';cell.style.minWidth=Math.min(column.width,160)+'px';cell.style.maxWidth=Math.max(column.width,80)+'px';cell.style.whiteSpace=column.wrap?'normal':'nowrap';cell.style.overflowWrap='anywhere';}
function addTags(row,data){const host=row.tagName==='TR'?row.cells[0]:row;if(!host)return;let tags=host.querySelector(':scope>[data-stored-behavior-tags]');if(!tags){tags=document.createElement('div');tags.dataset.storedBehaviorTags='';tags.className='crm-behavior-labels';host.append(tags);}const signature=JSON.stringify(data?.tags||[]);if(tags.dataset.signature===signature)return;tags.dataset.signature=signature;tags.replaceChildren(...(data?.tags||[]).map(label=>{const el=document.createElement('span');el.className='crm-behavior-label';el.textContent=label;return el;}));}
function prepare(){read();for(const el of document.querySelectorAll('[data-crm-ui]')){const rule=rules.get(el.dataset.crmUi),behavior=rule?.behavior;if(!behavior)continue;if(behavior.tooltip)el.title=behavior.tooltip;if(behavior.appearance&&behavior.appearance!=='default')el.classList.add('structure-button-'+behavior.appearance);}
for(const field of document.querySelectorAll('[data-structure-order]')){const group=field.closest('.crm-field')||field.parentElement;if(group){group.style.order=field.dataset.structureOrder;if(field.dataset.structureHide==='1')group.hidden=true;}const label=field.id?document.querySelector('label[for="'+CSS.escape(field.id)+'"]'):null;const nativeLabel=label||group?.querySelector('label');if(nativeLabel&&field.dataset.structureLabel){const texts=[...nativeLabel.childNodes].filter(node=>node.nodeType===3&&node.textContent.trim());if(texts.length){texts[0].textContent=field.dataset.structureLabel+' ';for(const text of texts.slice(1))text.textContent='';}}}
if(!payload.rows)return;
for(const table of document.querySelectorAll('main table')){const head=table.tHead?.rows[0];if(!head)continue;const rows=[...table.querySelectorAll('tbody>tr[data-feedback-record]')].filter(row=>row.dataset.feedbackRecord?.startsWith(payload.row_kind+':'));if(!rows.length)continue;
for(const th of [...head.cells]){if(!th.dataset.structureSlot)th.dataset.structureSlot=th.dataset.crmUi||'base-'+th.cellIndex;for(const row of rows){const cell=row.cells[th.cellIndex];if(cell&&!cell.dataset.structureSlot)cell.dataset.structureSlot=th.dataset.structureSlot;}}
for(const hidden of payload.hidden||[]){const th=[...head.cells].find(cell=>cell.dataset.crmUi===hidden);if(th){const i=th.cellIndex;th.setAttribute('data-structure-hidden-col','');for(const row of rows)row.cells[i]?.setAttribute('data-structure-hidden-col','');}}
for(const column of payload.columns){let th=column.component?[...head.cells].find(cell=>cell.dataset.crmUi===column.component):null;let index=th?.cellIndex;
if(!th){th=[...head.cells].find(cell=>cell.dataset.structureColumn===column.key);if(!th){th=document.createElement('th');th.dataset.structureColumn=column.key;th.className='structure-cell';head.append(th);}index=th.cellIndex;}
th.dataset.structureSlot=th.dataset.structureSlot||'added-'+column.key;th.dataset.structurePosition=column.position;if(th.textContent!==column.label)th.textContent=column.label;style(th,column);
for(const row of rows){const id=row.dataset.feedbackRecord.split(':').at(-1),data=payload.rows[id];if(!data)continue;let cell=column.component?row.cells[index]:row.querySelector('[data-structure-column="'+column.key+'"]');if(!cell){cell=document.createElement('td');cell.dataset.structureColumn=column.key;cell.dataset.label=column.label;cell.className='structure-cell';row.append(cell);}cell.dataset.structureSlot=th.dataset.structureSlot;cell.dataset.structureColumn=column.key;fill(cell,data,column);style(cell,column);}
}
const ordered=[...head.cells].map((cell,index)=>({cell,index,position:Number(cell.dataset.structurePosition??cell.dataset.crmOrder??index*10)})).sort((a,b)=>a.position-b.position||a.index-b.index).map(item=>item.cell);
if(ordered.some((cell,index)=>head.cells[index]!==cell)){for(const cell of ordered)head.append(cell);for(const row of rows){if([...row.cells].some(cell=>cell.colSpan>1))continue;const bySlot=new Map([...row.cells].map(cell=>[cell.dataset.structureSlot,cell]));for(const th of ordered){const cell=bySlot.get(th.dataset.structureSlot);if(cell)row.append(cell);}}}
for(const row of rows)addTags(row,payload.rows[row.dataset.feedbackRecord.split(':').at(-1)]);
}
for(const card of document.querySelectorAll('main :is(article,div)[data-feedback-record]')){if(!card.dataset.feedbackRecord?.startsWith(payload.row_kind+':')||card.tagName==='TR')continue;const row=payload.rows[card.dataset.feedbackRecord.split(':').at(-1)];if(!row)continue;addTags(card,row);let list=card.querySelector(':scope>.structure-mobile-values');if(!list){list=document.createElement('dl');list.className='structure-mobile-values';card.append(list);}for(const column of payload.columns){let item=list.querySelector('[data-structure-column="'+column.key+'"]');if(!item){item=document.createElement('div');item.dataset.structureColumn=column.key;const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=column.label;item.append(dt,dd);list.append(item);}fill(item.querySelector('dd'),row,column);item.style.order=column.position;}}
}
document.addEventListener('click',event=>{const el=event.target.closest('a[data-crm-ui],button[data-crm-ui]');if(!el)return;const b=rules.get(el.dataset.crmUi)?.behavior;if(!b)return;if(b.action_kind==='popup'){event.preventDefault();event.stopImmediatePropagation();const form=el.closest('form'),controls=new Map(form?[...form.querySelectorAll('input[name],select[name],textarea[name]')].map(input=>[input.name,input]):[]);window.CRMBehaviors?.showPopup({text:b.popup_text||b.tooltip||el.textContent.trim(),target:b.popup_target||''},controls,false);return;}if(b.confirmation&&!confirm(b.confirmation)){event.preventDefault();event.stopImmediatePropagation();return;}let destination=b.action_kind==='navigate'?b.destination:null;if(b.action_kind==='workflow'){const row=el.closest('[data-feedback-record]');destination=payload.rows?.[row?.dataset.feedbackRecord.split(':').at(-1)]?.url;if(!destination){event.preventDefault();event.stopImmediatePropagation();return;}}if(destination){event.preventDefault();event.stopImmediatePropagation();location.assign(destination);}},true);
document.addEventListener('input',event=>{if(event.target.matches('[name^=extra_]'))event.target.dataset.structureTouched='1';});
document.addEventListener('submit',event=>{const form=event.target;if(form.method?.toLowerCase()!=='get'||form.hasAttribute('data-structure-filters')||!form.closest('main'))return;for(const [key,val]of new URLSearchParams(location.search))if((key.startsWith('sf_')||key==='sq')&&!form.elements.namedItem(key)){const input=document.createElement('input');input.type='hidden';input.name=key;input.value=val;form.append(input);}},true);
document.addEventListener('DOMContentLoaded',prepare);document.addEventListener('crm:results-updated',prepare);document.addEventListener('htmx:afterSwap',prepare);new MutationObserver(records=>{if(queued||!records.some(record=>[...record.addedNodes].some(node=>node.nodeType===1&&(node.matches?.('[data-feedback-record],script[data-structure-payload]')||node.querySelector?.('[data-feedback-record],script[data-structure-payload]')))))return;queued=true;requestAnimationFrame(()=>{queued=false;prepare();});}).observe(document.documentElement,{subtree:true,childList:true});window.CRMStructure={prepare};
})();</script>
