<script>
(function(){
 'use strict';if(typeof window.ApexCharts!=='function')return;
 const Original=window.ApexCharts;let serial=0;
 function format(value){if(value===null||value===undefined)return 'ثبت نشده';if(Array.isArray(value))return value.map(format).join(' تا ');return window._faDigits?window._faDigits(value):String(value);}
 function addDataView(el,readOptions){
  const options=readOptions();
  if(!el||el.dataset.crmChart)return;el.dataset.crmChart='1';el.classList.add('crm-chart');
  const heading=el.parentElement?.querySelector('h2,h3,h4'),title=options.title?.text||heading?.textContent.trim()||'نمودار';el.setAttribute('role','img');el.setAttribute('aria-label',title+'؛ داده‌ها در جدول زیر نیز قابل مشاهده‌اند.');
  const control=document.createElement('div');control.className='crm-chart-tools';const button=document.createElement('button');button.type='button';button.className='crm-chart-toggle';button.textContent='نمایش جدول داده‌ها';button.setAttribute('aria-expanded','false');const panel=document.createElement('div');panel.id='crm-chart-data-'+(++serial);panel.hidden=true;panel.className='crm-chart-data';button.setAttribute('aria-controls',panel.id);control.appendChild(button);el.before(control);el.after(panel);
  button.addEventListener('click',()=>{const show=panel.hidden;if(show){panel.replaceChildren();const options=readOptions();const rows=[],series=options.series||[],categories=options.xaxis?.categories||[];
   const valueFor=(value,seriesIndex,pointIndex)=>{const rule=Array.isArray(options.tooltip?.y)?options.tooltip.y[seriesIndex]:options.tooltip?.y;if(typeof value==='number'&&typeof rule?.formatter==='function'){try{const text=rule.formatter(value,{seriesIndex,dataPointIndex:pointIndex,w:{config:options}});if(typeof text==='string'&&!/[<>]/.test(text))return text;}catch(_){}}return value;};
   series.forEach((item,seriesIndex)=>{if(typeof item==='number'||item===null){rows.push([options.labels?.[seriesIndex]||String(seriesIndex+1),valueFor(item,seriesIndex,seriesIndex)]);return;}if(!item||!Array.isArray(item.data))return;item.data.forEach((point,index)=>{const object=point!==null&&typeof point==='object'&&!Array.isArray(point);rows.push([item.name||title,object?point.x:categories[index]??(index+1),valueFor(object?point.y:point,seriesIndex,index)]);});});
   const table=document.createElement('table'),caption=document.createElement('caption');caption.textContent='داده‌های '+title;table.appendChild(caption);const head=document.createElement('thead'),tr=document.createElement('tr');(rows.some(row=>row.length===3)?['شاخص / مجموعه','دسته / زمان','مقدار']:['عنوان','مقدار']).forEach(text=>{const th=document.createElement('th');th.scope='col';th.textContent=text;tr.appendChild(th);});head.appendChild(tr);table.appendChild(head);const body=document.createElement('tbody');rows.forEach(row=>{const tr=document.createElement('tr');row.forEach(value=>{const td=document.createElement('td');td.textContent=format(value);tr.appendChild(td);});body.appendChild(tr);});table.appendChild(body);if(rows.length)panel.appendChild(table);else {const empty=document.createElement('p');empty.textContent='داده‌ای برای این نمودار ثبت نشده است.';panel.appendChild(empty);}
  }panel.hidden=!show;button.setAttribute('aria-expanded',String(show));button.textContent=show?'بستن جدول داده‌ها':'نمایش جدول داده‌ها';});
 }
 function optionsFor(options){const result={...options};result.chart={foreColor:'#475569',fontFamily:'Vazirmatn',...options.chart};if(matchMedia('(prefers-reduced-motion: reduce)').matches)result.chart.animations={...result.chart.animations,enabled:false};result.noData={text:'داده‌ای در این بازه ثبت نشده است.',align:'center',verticalAlign:'middle',style:{color:'#64748b',fontSize:'13px'},...options.noData};result.grid={borderColor:'#e9eef5',strokeDashArray:3,...options.grid};result.tooltip={...options.tooltip,style:{fontSize:'12px',...options.tooltip?.style}};result.legend={fontSize:'12px',itemMargin:{horizontal:10,vertical:6},...options.legend};return result;}
 window.ApexCharts=function(el,options){const chosen=typeof el==='string'?document.querySelector(el):el,styled=optionsFor(options||{});const chart=new Original(el,styled);addDataView(chosen,()=>chart.w?.config||styled);const originalRender=chart.render.bind(chart),originalDestroy=chart.destroy.bind(chart);let observer=null,destroyed=false,lastWidth=0,frame=null;
  chart.render=function(){return new Promise((resolve,reject)=>{const start=()=>requestAnimationFrame(()=>{if(destroyed){resolve();return;}Promise.resolve(originalRender()).then(value=>{if(chosen&&window.ResizeObserver&&!observer){observer=new ResizeObserver(()=>{const width=Math.floor(chosen.getBoundingClientRect().width);if(width<60||Math.abs(width-lastWidth)<2)return;lastWidth=width;cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{if(!destroyed)chart.updateOptions({chart:{width:width}},false,false,false);});});observer.observe(chosen);}resolve(value);},reject);});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();});};
  chart.destroy=function(){destroyed=true;observer?.disconnect();cancelAnimationFrame(frame);return originalDestroy();};return chart;};
 Object.setPrototypeOf(window.ApexCharts,Original);window.ApexCharts.prototype=Original.prototype;
})();
</script>
