 const pagination=data.pagination;document.getElementById('crm-task-result-count').textContent=Object.keys(data.filter_errors||{}).length?'فیلترهای نامعتبر را اصلاح کنید.':number(pagination.total)+' نتیجه · صفحه '+number(pagination.page)+' از '+number(pagination.pages);renderPageNumbers(pagination);document.getElementById('crm-task-pagination').hidden=pagination.pages<=1;document.getElementById('crm-task-page-label').textContent='صفحه '+number(pagination.page)+' از '+number(pagination.pages)+' · '+number(pagination.total)+' کار';document.getElementById('crm-task-previous').disabled=!pagination.has_previous;document.getElementById('crm-task-next').disabled=!pagination.has_next;page=pagination.page;if(previous){const row=Array.from(list.children).find(row=>row.dataset.taskRow===previous);row?.querySelector('button,a')?.focus({preventScroll:true});}position();if(scrollToItems){scrollToItems=false;if(innerWidth<1024)box.scrollTop=Math.max(0,list.offsetTop-100);else list.scrollTop=0;}}
 async function readChanges(values){loadError.textContent='';try{const response=await fetch(readEndpoint,{method:'POST',headers:{'X-CSRFToken':csrf(),'X-Requested-With':'XMLHttpRequest'},body:new URLSearchParams(values)});if(!response.ok)throw new Error();await poll();}catch(_){loadError.textContent='خوانده‌شدن تغییرات ثبت نشد؛ دوباره تلاش کنید.';}}
 async function poll(){clearTimeout(timer);if(stopped)return;if(document.hidden){timer=setTimeout(poll,12000);return;}controller?.abort();controller=new AbortController();const current=++sequence,signal=controller.signal,timeout=setTimeout(()=>{if(current===sequence)controller.abort();},8000);const url=new URL(endpoint,location.origin);url.search=new URLSearchParams({view,due,q:query,page,...queueParams()}).toString();const changing=!data||data.view!==view||data.due!==due||data.query!==query||data.pagination.page!==page||!listSignature;if(box.open&&changing)list.setAttribute('aria-busy','true');try{const response=await fetch(url,{headers:{'X-Requested-With':'XMLHttpRequest','Accept':'application/json'},signal,cache:'no-store'});if(current!==sequence)return;if(response.status===401||response.status===403){stopped=true;launchers.forEach(button=>button.hidden=true);if(box.open)closeInbox();if(dialog.open&&!busy)closeReport();return;}if(!response.ok)throw new Error();data=await response.json();if(current!==sequence)return;for(const [name,choices]of Object.entries(data.filter_choices||{})){const field=queueFilters.elements.namedItem(name);if(!field)continue;const selected=field.value,blank=field.options[0]?.textContent||'همه',signature=JSON.stringify(choices);if(field.dataset.choices===signature)continue;field.dataset.choices=signature;field.replaceChildren(new Option(blank,''),...choices.map(([value,label])=>new Option(label,value)));field.value=selected;}loadError.textContent=showQueueErrors(data.filter_errors||{});for(const launcher of launchers){const count=launcher.querySelector('[data-task-count]');count.textContent=data.attention_count>99?'۹۹+':number(data.attention_count);count.hidden=!data.attention_count;launcher.querySelector('[data-task-news]').hidden=!!data.attention_count||!data.counts.updates_unread;launcher.title=number(data.attention_count)+' کار نیازمند رسیدگی · '+number(data.counts.updates_unread)+' تغییر خوانده‌نشده';launcher.setAttribute('aria-label','وظایف من، '+launcher.title);}document.getElementById('crm-task-attention').textContent=data.attention_count?number(data.attention_count)+' کار نیاز به رسیدگی شما دارد':'کاری برای رسیدگی باقی نمانده است';const newest=data.notices[0]?.id||0;if(newest>previousNotice){if(previousNotice)message(data.notices[0].title);previousNotice=newest;try{sessionStorage.setItem('crm-task-last-notice:'+userId,String(newest));}catch(_){}}renderState();renderItems();maybeOpen();}catch(exception){if(current===sequence){loadError.textContent='دریافت اطلاعات تازه انجام نشد؛ دوباره تلاش می‌شود. از لینک فهرست کامل هم می‌توانید استفاده کنید.';if(!data)document.getElementById('crm-task-attention').textContent='دریافت وظایف موقتاً ممکن نیست.';}}finally{clearTimeout(timeout);if(current===sequence){list.setAttribute('aria-busy','false');if(!stopped)timer=setTimeout(poll,12000);}}}

 form.addEventListener('submit',async event=>{event.preventDefault();if(busy||!active)return;error.textContent='';if(!textarea.checkValidity()){textarea.reportValidity();return;}busy=true;textarea.readOnly=true;form.setAttribute('aria-busy','true');const submitting={...active},buttons=Array.from(dialog.querySelectorAll('button'));buttons.forEach(button=>button.disabled=true);try{const response=await fetch(reportEndpoint.replace('/0/','/'+submitting.task+'/'),{method:'POST',headers:{'X-CSRFToken':csrf(),'X-Requested-With':'XMLHttpRequest'},body:new URLSearchParams({text:textarea.value,event:submitting.event||''})});const result=await response.json();if(!response.ok){error.textContent=result.errors?.text?.map(item=>item.message).join(' ')||result.error||'ثبت گزارش انجام نشد؛ دوباره تلاش کنید.';textarea.focus();return;}if(data)data.reports=data.reports.filter(item=>item.event!==submitting.event);message(result.message);closeReport(true);if(location.pathname.endsWith('/hr/tasks/'+submitting.task+'/')){location.reload();return;}const row=document.querySelector('[data-feedback-record="task:'+submitting.task+'"] [data-label="وضعیت"]');if(row)row.textContent=result.status;document.dispatchEvent(new CustomEvent('crm:task-reported',{detail:result}));poll();}catch(_){error.textContent='ارتباط برقرار نشد؛ متن گزارش حفظ شده است. دوباره ثبت کنید.';}finally{busy=false;textarea.readOnly=false;form.removeAttribute('aria-busy');buttons.forEach(button=>button.disabled=false);}});
