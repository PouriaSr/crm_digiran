<style>
.crm-modal-preview{padding:18px;min-width:0;max-height:70dvh;overflow:auto;overscroll-behavior:contain;background:#fff;border-radius:14px}.crm-modal-preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.crm-modal-preview-head button{padding:9px 14px;border:1px solid #cbd5e1;border-radius:9px;background:#f8fafc;color:#334155;min-height:42px}.crm-modal-preview-content{min-width:0;overflow:auto}.crm-modal-preview-status{font-size:12px;line-height:1.9;color:#64748b}.crm-preview-hidden{display:none!important}
</style>
<script>
(function(){
 'use strict';if(window.CRMModalPreview)return;
 const states=new WeakMap();let serial=0;
 function modalFor(node){return node.closest('dialog[open],[role="dialog"],.crm-modal-shell');}
 function eligible(link){const modal=modalFor(link);if(!modal||link.download||link.target==='_blank')return null;const url=new URL(link.href,location.href);if(url.origin!==location.origin||!url.hash)return null;return {modal,url,target:url.hash.slice(1)};}
 function restore(modal){const state=states.get(modal);if(!state)return;state.controller?.abort();state.panel.remove();for(const child of state.hidden)child.classList.remove('crm-preview-hidden');states.delete(modal);state.opener?.focus({preventScroll:true});}
 async function load(modal,url,target){const state=states.get(modal);if(!state)return;state.controller?.abort();const controller=new AbortController();state.controller=controller;state.content.setAttribute('aria-busy','true');state.status.textContent='در حال دریافت پیش‌نمایش…';
  try{const response=await fetch(url,{signal:controller.signal,headers:{'X-Requested-With':'XMLHttpRequest'}});if(!response.ok)throw Error('نمایش اطلاعات ممکن نشد.');const doc=new DOMParser().parseFromString(await response.text(),'text/html'),node=doc.getElementById(target);if(!node)throw Error('بخش مورد نظر برای پیش‌نمایش پیدا نشد.');const section=node.closest('section')||node;const clone=section.cloneNode(true);clone.querySelectorAll('script').forEach(el=>el.remove());const ids=new Map();for(const el of [clone,...clone.querySelectorAll('[id]')])if(el.id){const previous=el.id;el.id='crm-preview-'+(++serial);ids.set(previous,el.id);}for(const el of clone.querySelectorAll('[for]'))if(ids.has(el.htmlFor))el.htmlFor=ids.get(el.htmlFor);state.content.replaceChildren(clone);state.url=new URL(response.url);state.status.textContent='';window.CRMFilterUI?.prepare(state.content);window.CRMFeedback?.prepare(state.content);
  }catch(error){if(error.name!=='AbortError')state.status.textContent=error.message+' دوباره تلاش کنید یا به فرم برگردید.';}finally{if(state.controller===controller)state.content.removeAttribute('aria-busy');}
 }
 function open(link,info){const modal=info.modal,shell=modal.querySelector('.hr-dialog,.crm-modal-content')||modal;const panel=document.createElement('section');panel.className='crm-modal-preview';panel.setAttribute('aria-label','پیش‌نمایش اطلاعات');const head=document.createElement('header');head.className='crm-modal-preview-head';const title=document.createElement('strong');title.textContent=link.textContent.trim();const back=document.createElement('button');back.type='button';back.textContent='بازگشت به فرم';back.onclick=()=>restore(modal);head.append(title,back);const status=document.createElement('p');status.className='crm-modal-preview-status';status.setAttribute('role','status');const content=document.createElement('div');content.className='crm-modal-preview-content';panel.append(head,status,content);const hidden=Array.from(shell.children).filter(el=>!el.matches('style,script')&&!el.classList.contains('crm-preview-hidden'));hidden.forEach(el=>el.classList.add('crm-preview-hidden'));shell.append(panel);states.set(modal,{panel,hidden,opener:link,content,status,target:info.target,url:info.url});back.focus();load(modal,info.url,info.target);}
 document.addEventListener('click',event=>{const link=event.target.closest('a[href]');if(!link||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;const modal=modalFor(link),state=modal&&states.get(modal);if(state&&state.panel.contains(link)){const url=new URL(link.href,state.url);if(url.origin!==location.origin)return;event.preventDefault();event.stopImmediatePropagation();load(modal,url,state.target);return;}const info=eligible(link);if(!info)return;event.preventDefault();event.stopImmediatePropagation();open(link,info);},true);
 document.addEventListener('submit',event=>{const modal=modalFor(event.target),state=modal&&states.get(modal);if(!state||!state.panel.contains(event.target)||event.target.method.toLowerCase()!=='get')return;event.preventDefault();event.stopImmediatePropagation();const url=new URL(event.target.getAttribute('action')||state.url,location.href);url.search=new URLSearchParams(new FormData(event.target)).toString();load(modal,url,state.target);},true);
 document.addEventListener('keydown',event=>{if(event.key!=='Escape')return;const modal=modalFor(event.target);if(modal&&states.has(modal)){event.preventDefault();event.stopImmediatePropagation();restore(modal);}},true);
 document.addEventListener('close',event=>restore(event.target),true);
 window.CRMModalPreview={restore};
})();
</script>
