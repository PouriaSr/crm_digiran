<style>
[data-hiring-selection]>.crm-local-feedback{flex:0 0 100%}.crm-local-feedback{display:block;box-sizing:border-box;padding:9px 12px;margin:0 0 8px;border:1px solid #bfdbfe;border-radius:10px;background:#eff6ff;color:#1d4ed8;font-size:12px;line-height:1.8;white-space:normal;overflow-wrap:anywhere;text-align:right}.crm-local-feedback[data-feedback-level=error],.crm-local-feedback[data-feedback-level=warning]{background:#fff1f2;color:#be123c;border-color:#fecdd3}.crm-local-feedback[data-feedback-level=warning]{background:#fffbeb;color:#92400e;border-color:#fde68a}.crm-local-feedback[data-feedback-level=success]{background:#ecfdf5;color:#047857;border-color:#a7f3d0}.crm-field-errors,.errorlist,.duplicate-error{margin:0 0 8px!important;font-size:12px;line-height:1.8}.crm-field-errors[hidden],[data-field-feedback-source][hidden]{display:none!important}.crm-field-feedback-row>td{padding:10px!important;background:#fff}.crm-field-feedback-row .crm-local-feedback{margin:0}.crm-inline-info:has(.crm-local-feedback){flex-wrap:wrap}.crm-inline-info>.crm-local-feedback{flex-basis:100%}
</style>
<script>
(function(){
 'use strict';if(window.CRMFeedback)return;
 let count=0,queued=false;
 function visible(node){return !!node&&node.getClientRects().length>0&&getComputedStyle(node).visibility!=='hidden';}
 function visual(field){if(field.tagName==='SELECT'&&field.closest('.product-autocomplete')){const search=field.closest('.product-autocomplete').querySelector('.product-search');if(search)return search.closest('.relative')||search;}const wrapped=field.closest('label');if(wrapped&&['checkbox','radio'].includes(field.type))return wrapped.closest('.crm-entry-head')||wrapped;if(field.tomselect)return field.tomselect.wrapper;const parent=field.parentElement;if(parent?.matches('.relative,.crm-password-wrap,[data-input-icon-left],[data-input-icon-right]')&&parent.querySelectorAll('input:not([type=hidden]),select,textarea').length===1)return parent;return field;}
 function ensureVisible(field){for(let node=field;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;const root=field.closest('#call-modal-root');if(root&&window.Alpine){try{Alpine.$data(root).isCallModalOpen=true;}catch(_){}}}
 function insert(target,node){if(!target)return;const tag=target.tagName;if(['INPUT','SELECT','TEXTAREA'].includes(tag)){ensureVisible(target);const point=visual(target);if(point.previousElementSibling!==node)point.before(node);node.dataset.feedbackField=target.id||target.name;if(!node.id)node.id='crm-local-message-'+(++count);const ids=new Set((target.getAttribute('aria-describedby')||'').split(/\s+/).filter(Boolean));ids.add(node.id);target.setAttribute('aria-describedby',Array.from(ids).join(' '));if(node.dataset.feedbackLevel==='error')target.setAttribute('aria-invalid','true');const paired=target.tagName==='SELECT'&&target.closest('.product-autocomplete')?.querySelector('.product-search');if(paired){paired.setAttribute('aria-describedby',node.id);if(node.dataset.feedbackLevel==='error')paired.setAttribute('aria-invalid','true');}}
  else if(tag==='DETAILS'){target.before(node);}else if(tag==='FORM'){target.prepend(node);}else if(tag==='TR'){const row=document.createElement('tr');row.className='crm-field-feedback-row';const cell=document.createElement('td');cell.colSpan=target.cells.length||1;cell.appendChild(node);row.appendChild(cell);target.before(row);}else if(tag==='BUTTON'){insert(target.closest('form,.wf-record,[data-hiring-selection]')||target.parentElement,node);}else target.prepend(node);
 }
 function show(target,message,level='info'){if(!target)return null;if(level==='success'&&['INPUT','SELECT','TEXTAREA'].includes(target.tagName)){target.removeAttribute('aria-invalid');const old=target.id&&document.getElementById(target.id+'-errors');if(old)old.remove();}const key=target.id||target.name;const scope=target.form||target.parentElement;for(const old of scope?.querySelectorAll('.crm-local-feedback[data-feedback-field]')||[])if(key&&old.dataset.feedbackField===key)old.remove();const node=document.createElement('div');node.className='crm-local-feedback';node.dataset.feedbackLevel=level;node.setAttribute('role',level==='error'?'alert':'status');node.textContent=message;insert(target,node);return node;}
 function firstBox(){const main=document.querySelector('main')||document.body;for(const selector of ['[data-feedback-box]','[data-live-results]','form[data-crm-form]','form.crm-filter-toolbar','.wf-panel','.bg-white','form']){const node=Array.from(main.querySelectorAll(selector)).find(visible);if(node)return node;}return main;}

 function localTarget(context){if(context.field){const field=document.getElementById(context.field)||Array.from(document.querySelectorAll('input[name],select[name],textarea[name]')).find(el=>el.name===context.field);if(field)return field;}
  if(context.form){try{const form=document.querySelector(context.form);if(form)return form;}catch(_){}}
  if(context.record){const direct=Array.from(document.querySelectorAll('[data-feedback-record]')).find(el=>el.dataset.feedbackRecord===context.record&&visible(el));if(direct)return direct;const [kind,id]=context.record.split(':');if(kind==='note'){const note=document.querySelector('[data-note-id="'+CSS.escape(id)+'"]');if(note)return note;}if(kind==='reception'){const row=document.querySelector('[data-reception-id="'+CSS.escape(id)+'"]');if(row)return row;}
   const paths={customer:'customers',call:'calls',product:'products',category:'products/categories',invoice:'invoices',user:'accounts/users',employee:'hr/employees',task:'hr/tasks',leave:'hr/leaves',attendance:'hr/attendance',source:'ads/manage/sources',platform:'ads/manage/platforms',process:'ads/manage/processes',ad:'ads'};const path=paths[kind];if(path){for(const link of document.querySelectorAll('a[href]')){let url;try{url=new URL(link.href,location.href);}catch(_){continue;}if(url.pathname.includes('/'+path+'/'+id+'/')){const row=link.closest('tr,article,.wf-record,[data-note-id]')||link.closest('.bg-white');if(row&&visible(row))return row;}}}
  }
  if(context.source){const form=Array.from(document.forms).find(el=>{try{return new URL(el.getAttribute('action')||location.href,location.href).pathname===context.source&&visible(el);}catch(_){return false;}});if(form)return form;}
  return firstBox();
 }
 function placeQueue(root=document){for(const queue of root.querySelectorAll('template[data-feedback-queue]')){for(const node of Array.from(queue.content.children)){let context={};try{context=JSON.parse(node.dataset.feedbackContext||'{}');}catch(_){}insert(localTarget(context),node);}queue.remove();}}
 function moveErrors(root=document){for(const source of root.querySelectorAll('[data-field-feedback-source]')){for(const node of Array.from(source.querySelectorAll('[data-error-for]'))){const id=node.dataset.errorFor,field=document.getElementById(id);if(!field)continue;const same=Array.from((field.form||document).querySelectorAll('.crm-field-errors,.crm-local-feedback')).find(other=>other!==node&&other.textContent.trim()===node.textContent.trim()&&(other.id===id+'-errors'||other.dataset.feedbackField===id));if(same){insert(field,same);node.remove();}else{node.hidden=false;node.classList.add('crm-local-feedback');node.dataset.feedbackLevel='error';insert(field.type==='hidden'?field.form:field,node);}}
   const generic=source.querySelector('[data-generic-errors]');if(generic&&generic.textContent.trim()){generic.hidden=false;generic.classList.add('crm-local-feedback');generic.dataset.feedbackLevel='error';insert(source.closest('form')||firstBox(),generic);}source.hidden=true;
  }
  for(const field of root.querySelectorAll('input[id],select[id],textarea[id]')){const error=document.getElementById(field.id+'-errors');if(error&&!error.closest('[data-field-feedback-source]'))insert(field,error);const group=field.closest('.crm-field')||field.parentElement;if(group.querySelectorAll('input:not([type=hidden]),select,textarea').length===1)for(const inline of group.querySelectorAll('ul.errorlist,p.text-red-600,p.text-red-500'))if(!inline.closest('[data-field-feedback-source]')){inline.dataset.feedbackLevel='error';insert(field,inline);}}
 }
 function prepare(root=document){moveErrors(root);placeQueue(root);for(const form of root.querySelectorAll('form')){const invalid=Array.from(form.querySelectorAll('[aria-invalid=true]')).find(el=>visible(visual(el)));if(invalid&&!form.dataset.localErrorFocused){form.dataset.localErrorFocused='1';requestAnimationFrame(()=>window.CRMForms?.focusField(invalid));}}
 }
 function validity(field){const v=field.validity;if(v.customError)return field.validationMessage;if(v.valueMissing)return field.tagName==='SELECT'?'یک گزینه را انتخاب کنید.':field.type==='checkbox'?'این گزینه را تأیید کنید.':'این فیلد را تکمیل کنید.';if(v.typeMismatch&&field.type==='email')return 'ایمیل معتبر وارد کنید.';if(v.rangeUnderflow)return 'مقدار نباید از '+field.min+' کمتر باشد.';if(v.rangeOverflow)return 'مقدار نباید از '+field.max+' بیشتر باشد.';if(v.tooShort)return 'حداقل '+field.minLength+' نویسه وارد کنید.';if(v.tooLong)return 'حداکثر '+field.maxLength+' نویسه وارد کنید.';return 'مقدار واردشده معتبر نیست؛ قالب این فیلد را بررسی کنید.';}
 document.addEventListener('invalid',event=>{const field=event.target;if(!field.form)return;event.preventDefault();show(field,validity(field),'error');const first=Array.from(field.form.elements).find(el=>el.willValidate&&!el.validity.valid);if(first===field)requestAnimationFrame(()=>{if(window.CRMForms)window.CRMForms.focusField(field);else if(field.tomselect)field.tomselect.focus();else field.focus();});},true);
 function clearValid(event){const field=event.target;if(!field.form)return;if(field.validity?.valid){field.removeAttribute('aria-invalid');for(const node of field.form.querySelectorAll('[data-feedback-field]'))if(node.dataset.feedbackField===(field.id||field.name))node.remove();const error=field.id&&document.getElementById(field.id+'-errors');if(error)error.remove();const paired=field.tagName==='SELECT'&&field.closest('.product-autocomplete')?.querySelector('.product-search');if(paired&&field.value)paired.removeAttribute('aria-invalid');}}
 document.addEventListener('input',clearValid);document.addEventListener('change',clearValid);
 async function captureResponse(response){if(!response.redirected)return;try{const doc=new DOMParser().parseFromString(await response.clone().text(),'text/html');const items=[];for(const queue of doc.querySelectorAll('template[data-feedback-queue]'))for(const node of queue.content.children)items.push({text:node.textContent,level:node.dataset.feedbackLevel,context:node.dataset.feedbackContext});if(items.length)sessionStorage.setItem('crm-local-feedback',JSON.stringify({expires:Date.now()+120000,path:new URL(response.url).pathname,items}));}catch(_){}}
 function remember(text,level,context={}){try{sessionStorage.setItem('crm-local-feedback',JSON.stringify({expires:Date.now()+120000,path:location.pathname,items:[{text,level,context:JSON.stringify(context)}]}));}catch(_){}}
 function restore(){try{const value=JSON.parse(sessionStorage.getItem('crm-local-feedback')||'null');if(!value)return;sessionStorage.removeItem('crm-local-feedback');if(value.expires<Date.now()||value.path!==location.pathname)return;for(const item of value.items){let context={};try{context=JSON.parse(item.context||'{}');}catch(_){}show(localTarget(context),item.text,item.level);}}catch(_){}}

 document.addEventListener('submit',async event=>{
  const form=event.target;if(!form.matches('form[data-local-submit]'))return;event.preventDefault();if(form.dataset.localSubmitting==='1')return;form.dataset.localSubmitting='1';const submit=form.querySelector('[type=submit]');if(submit)submit.disabled=true;
  try{const response=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'text/html'}});if(!response.ok)throw new Error(response.status===403?'برای این عملیات دسترسی ندارید.':'ثبت انجام نشد؛ دوباره تلاش کنید.');const doc=new DOMParser().parseFromString(await response.clone().text(),'text/html');const items=[];for(const queue of doc.querySelectorAll('template[data-feedback-queue]'))items.push(...queue.content.children);
   if(items.some(item=>item.dataset.feedbackLevel==='error')){for(const item of items){let context={};try{context=JSON.parse(item.dataset.feedbackContext||'{}');}catch(_){}const field=context.field&&Array.from(form.elements).find(el=>el.id===context.field||el.name===context.field);show(field||form,item.textContent,item.dataset.feedbackLevel);}const first=form.querySelector('[aria-invalid=true]');if(first)window.CRMForms?.focusField(first);return;}
   if(response.redirected){await captureResponse(response);window.location.assign(response.url);}else throw new Error('پاسخ ثبت قابل دریافت نبود؛ دوباره تلاش کنید.');
  }catch(error){show(form,error.message,'error');}finally{form.dataset.localSubmitting='0';if(submit)submit.disabled=false;const root=form.closest('#call-modal-root');if(root&&window.Alpine){try{Alpine.$data(root).submitting=false;}catch(_){}}}
 });
 document.addEventListener('DOMContentLoaded',()=>{prepare();restore();});document.addEventListener('crm:results-updated',event=>prepare(event.detail?.root||document));document.addEventListener('htmx:afterSwap',event=>prepare(event.detail?.target||document));new MutationObserver(records=>{if(queued||!records.some(r=>Array.from(r.addedNodes).some(node=>node.nodeType===1&&(node.matches?.('form,[data-field-feedback-source],template[data-feedback-queue]')||node.querySelector?.('form,[data-field-feedback-source],template[data-feedback-queue]')))))return;queued=true;requestAnimationFrame(()=>{queued=false;prepare();});}).observe(document.documentElement,{childList:true,subtree:true});window.CRMFeedback={show,prepare,visual,captureResponse,insert,remember};
})();
</script>
