<script>
(function(){

 function text(label){if(!label)return '';const copy=label.cloneNode(true);copy.querySelectorAll('select,input,textarea,button,svg,.ts-wrapper,.crm-required,.crm-optional').forEach(node=>node.remove());return copy.textContent.replace(/[\s*:]+/g,' ').trim();}
 function labelNode(field){const form=field.form;let label=Array.from(field.labels||[]).find(el=>el.isConnected);if(label)return label;for(let node=field.parentElement;node&&node!==form;node=node.parentElement){const labels=Array.from(node.children).filter(el=>el.tagName==='LABEL');const controls=node.querySelectorAll('select[name],input[name]:not([type=hidden]),textarea[name]');if(labels.length===1&&controls.length===1)return labels[0];}return null;}

 function prepareFilters(root=document){const forms=[...(root.matches?.('form.crm-filter-form')?[root]:[]),...root.querySelectorAll('form.crm-filter-form')];for(const form of forms){if(form.dataset.filterPrepared==='1')continue;const fields=controls(form);if(!fields.length||!fields.some(el=>!['q','workflow_q','ad_q','r'].includes(el.name)))continue;form.dataset.filterPrepared='1';

  for(const field of fields){const fieldErrors=Array.from(field.parentElement.querySelectorAll(':scope>.errorlist'));const title=labelFor(field),oldPlaceholder=field.getAttribute('placeholder')||'';if(!field.id)field.id='crm-filter-'+(++serial);const wrapper=document.createElement('div');wrapper.className='crm-filter-field'+(['q','workflow_q','ad_q'].includes(field.name)?' crm-filter-search':'');const head=document.createElement('div');head.className='crm-filter-field-head';const label=document.createElement('label');label.htmlFor=field.id;label.textContent=title;label.title=title;head.appendChild(label);let help=field.dataset.filterHelp||'';
   if(field.hasAttribute('data-jdp')||field.type==='date'){field.placeholder='انتخاب تاریخ…';help=help||dateHelp;}else if(['q','workflow_q','ad_q'].includes(field.name)){field.placeholder='عبارت جستجو…';help=help||oldPlaceholder||'با نوشتن بخشی از نام یا شماره، نتیجه‌ها لحظه‌ای نمایش داده می‌شوند.';}
   if(!help&&field.tagName==='SELECT'&&field.options[0]?.value==='')help='با انتخاب «'+title+'»، نتیجه‌ها محدود می‌شوند. برای برداشتن این محدودیت، گزینه همه موارد را انتخاب کنید.';
   if(help)head.appendChild(helpButton(title,help));wrapper.appendChild(head);for(const error of fieldErrors){claimedErrors.add(error);error.id=field.id+'-errors';error.setAttribute('role','alert');field.setAttribute('aria-invalid','true');wrapper.appendChild(error);}if(field.tagName==='SELECT'){const first=field.options[0];if(first?.value===''&&/^[-—\s]+$/.test(first.textContent))first.textContent='همه موارد';field.dataset.placeholder=placeholder(field);}
   wrapper.appendChild(field);if(field.tomselect){wrapper.appendChild(field.tomselect.wrapper);field.tomselect.settings.placeholder=placeholder(field);field.tomselect.inputState();}track.appendChild(wrapper);
  }

 function prepareInputs(root=document){
  const forms=[...(root.matches?.('form')?[root]:[]),...root.querySelectorAll('form')];
  for(const form of forms){if(form.classList.contains('crm-filter-toolbar')||form.id==='changelist-form')continue;if(form.method.toLowerCase()==='get'&&!form.classList.contains('crm-filter-form'))continue;
   for(const field of controls(form)){if(field.dataset.infoPrepared==='1'||field.name.startsWith('perm__'))continue;const label=labelNode(field);const title=labelFor(field);if(!label&&!field.getAttribute('aria-label'))continue;
    // Search bars already use their search icon and accessible name.
    if(form.method.toLowerCase()==='get'&&['q','workflow_q','ad_q'].includes(field.name))continue;

    field.dataset.infoPrepared='1';if(!field.id)field.id='crm-entry-'+(++serial);
    const group=field.closest('.crm-field')||label?.parentElement||field.parentElement;
    const sources=group.querySelectorAll('.crm-field-help,.helptext,[id$="-help"],.help');
    const notes=Array.from(sources).filter(node=>!node.closest('.errorlist')&&node.textContent.trim()).map(node=>node.textContent.trim());

    for(const node of sources){node.hidden=true;node.dataset.infoSource='1';if(node.id&&!described.includes(node.id))described.push(node.id);}
    if(described.length)field.setAttribute('aria-describedby',described.join(' '));
    const conditional=field.closest('[data-result-panel],[data-invitation-panel]');
    if(conditional)notes.push('تکمیل این فیلد به نتیجه و گزینه‌های انتخاب‌شده در جلسه بستگی دارد.');
    else if(field.disabled||field.readOnly)notes.push('این فیلد در این صفحه قابل ویرایش نیست.');
    else if(field.required||(field.classList.contains('product-search')&&field.closest('.product-autocomplete')?.querySelector('select')?.required)||label?.querySelector('.crm-required,.text-red-500,.text-red-600'))notes.push('تکمیل این فیلد الزامی است.');
    else notes.push('تکمیل این فیلد اختیاری است.');
    if(field.classList.contains('product-search'))notes.push('نام یا کد کالا را جستجو کنید و یک کالا را از نتایج انتخاب کنید.');
    if(field.dataset.entryHelp)notes.unshift(field.dataset.entryHelp);
    if(/national_id/.test(field.name))notes.push('کد ملی ۱۰ رقمی را وارد کنید. ارقام فارسی، انگلیسی و عربی پذیرفته می‌شوند.');
    else if(/mobile|phone|call_number/.test(field.name))notes.push('شماره را همراه پیش‌شماره وارد کنید. ارقام فارسی، انگلیسی و عربی پذیرفته می‌شوند.');
    else if(field.type==='email')notes.push('ایمیل را به صورت name@example.com وارد کنید.');
    else if(field.hasAttribute('data-jdp'))notes.push('تاریخ شمسی را از تقویم انتخاب کنید یا به شکل ۱۴۰۵/۰۸/۰۱ بنویسید.');
    else if(['date','time','datetime-local'].includes(field.type))notes.push('مقدار را از انتخاب‌گر تاریخ یا ساعت وارد کنید.');
    else if(field.type==='number'){notes.push('ارقام فارسی، انگلیسی و عربی پذیرفته می‌شوند.');if(field.min!=='')notes.push('کمترین مقدار: '+field.min+' .');if(field.max!=='')notes.push('بیشترین مقدار: '+field.max+' .');}
    else if(field.type==='file'){notes.push('فایل را از دستگاه خود انتخاب کنید.');if(field.accept)notes.push('نوع فایل مجاز: '+field.accept+' .');}
    if(field.minLength>0)notes.push('حداقل '+field.minLength+' نویسه وارد کنید.');
    if(field.maxLength>0&&!/national_id|mobile|phone|call_number/.test(field.name))notes.push('حداکثر '+field.maxLength+' نویسه قابل ثبت است.');
    const hint=helpButton(title,Array.from(new Set(notes)).join(' '));
    if(label){let head=label.closest('.crm-entry-head');if(!head){head=document.createElement('div');head.className='crm-entry-head';label.before(head);
      if(label.contains(field)&&!['checkbox','radio'].includes(field.type)){const fresh=document.createElement('label');fresh.htmlFor=field.id;fresh.textContent=title;head.appendChild(fresh);head.after(field);if(field.tomselect)field.after(field.tomselect.wrapper);label.remove();}
      else{head.appendChild(label);if(!label.contains(field))label.htmlFor=field.id;}
     }head.appendChild(hint);
    }else{const line=document.createElement('div');line.className='crm-inline-info';field.before(line);line.appendChild(field);if(field.tomselect)line.appendChild(field.tomselect.wrapper);line.appendChild(hint);}
   }
  }

 document.addEventListener('pointerover',event=>{const button=event.target.closest('.crm-filter-help');if(button&&event.pointerType==='mouse')open(button);});document.addEventListener('pointerout',event=>{const button=event.target.closest('.crm-filter-help');if(button&&!button.contains(event.relatedTarget))delayHide();});document.addEventListener('focusin',event=>{if(event.target.matches('.crm-filter-help'))open(event.target);});document.addEventListener('focusout',event=>{if(event.target.matches('.crm-filter-help'))delayHide();});

 function reposition(){if(current&&!frame)frame=requestAnimationFrame(place);}window.addEventListener('scroll',reposition,true);window.addEventListener('resize',reposition);document.addEventListener('DOMContentLoaded',()=>prepare());document.addEventListener('crm:results-updated',event=>prepare(event.detail?.root||document));document.addEventListener('htmx:afterSwap',event=>prepare(event.detail?.target||document));let queued=false;new MutationObserver(records=>{if(queued||!records.some(record=>Array.from(record.addedNodes).some(node=>node.nodeType===1&&(node.matches?.('form,input[name],select[name],textarea[name]')||node.querySelector?.('form,input[name],select[name],textarea[name]')))))return;queued=true;requestAnimationFrame(()=>{queued=false;prepare();});}).observe(document.documentElement,{childList:true,subtree:true});window.CRMFilterUI={prepare,prepareInputs,labelFor,placeholder};
