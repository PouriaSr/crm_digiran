<style>

<script>
(function(){'use strict';if(window.CRMBehaviors)return;
const normalize=v=>v===true?'true':v===false?'false':v==null?'':Array.isArray(v)?v.map(normalize).join(','):String(v).trim().replace(/[۰-۹٠-٩]/g,ch=>'۰۱۲۳۴۵۶۷۸۹'.includes(ch)?'۰۱۲۳۴۵۶۷۸۹'.indexOf(ch):'٠١٢٣٤٥٦٧٨٩'.indexOf(ch));
function decimalCompare(a,b){function parse(value){const match=/^([+-]?)([0-9]*)(?:\.([0-9]*))?(?:e([+-]?[0-9]+))?$/i.exec(value);if(!match||!(match[2]||match[3]))return null;const digits=(match[2]+(match[3]||'')).replace(/^0+/,'');if(!digits)return{sign:0,digits:'0',position:0n};let exponent;try{exponent=BigInt(match[4]||'0');}catch(_){return null;}if(exponent>999999999999999999n||exponent< -999999999999999999n)return null;return{sign:match[1]==='-'?-1:1,digits,position:exponent-BigInt((match[3]||'').length)+BigInt(digits.length)};}const x=parse(a),y=parse(b);if(!x||!y)return null;if(x.sign!==y.sign)return x.sign>y.sign?1:-1;if(x.sign===0)return 0;if(x.position!==y.position)return(x.position>y.position?1:-1)*x.sign;const length=Math.max(x.digits.length,y.digits.length),left=x.digits.padEnd(length,'0'),right=y.digits.padEnd(length,'0');return(left===right?0:left>right?1:-1)*x.sign;}

function evaluate(input,rules){const values=structuredClone(input),seen=new Set();let stable=false;const hash=()=>JSON.stringify(Object.keys(values).sort().map(key=>[key,normalize(values[key])]));for(let turn=0;turn<16;turn++){const before=hash();for(const r of rules)if(matches(r,values)&&['set','clear'].includes(r.action))values[r.target]=r.action==='set'?(r.multiple?r.argument.split(',').map(v=>v.trim()).filter(Boolean):r.argument):(r.multiple?[]:'');const after=hash();if(before===after){stable=true;break;}if(seen.has(after))throw Error('قواعد تغییر مقدار حلقه ایجاد کرده‌اند.');seen.add(after);}if(!stable)throw Error('زنجیره قواعد فرم بیش از حد طولانی است.');const states={},tags=[],remove_tags=[],messages=[],matched=[];for(const r of rules){const s=r.target?(states[r.target]??={}):{};if(r.action==='show'&&s.visible===undefined)s.visible=false;if(!matches(r,values))continue;matched.push(String(r.id));if(['show','hide'].includes(r.action))s.visible=r.action==='show';else if(['require','optional'].includes(r.action))s.required=r.action==='require';else if(r.action==='choices')s.choices=r.argument.split(',').map(v=>v.trim()).filter(Boolean);else if(r.action==='clear')s.clear=true;else if(['add_tag','remove_tag'].includes(r.action)){const list=r.action==='add_tag'?tags:remove_tags;if(!list.includes(r.argument))list.push(r.argument);}else if(['popup','notice'].includes(r.action))messages.push({id:String(r.id),kind:r.action,target:r.target,text:r.argument,source:r.source});}return{values,states,tags,remove_tags,messages,matched};}
function groupInputs(el){const host=el.form||el.closest('[data-preview-root]')||el.parentElement,name=el.dataset.behaviorName||el.name;return [...host.querySelectorAll('input[type=checkbox]')].filter(input=>(input.dataset.behaviorName||input.name)===name);}
function commonGroup(items){let host=items[0].closest('.crm-field')||items[0].parentElement;while(host.parentElement&&!items.every(input=>host.contains(input)))host=host.parentElement;return host;}
function groupValidity(items){if(items[0])items[0].setCustomValidity(items[0].dataset.behaviorGroupRequired==='true'&&!items.some(input=>input.checked)?'حداقل یک گزینه را انتخاب کنید.':'');}

function controlValue(el){if(el.type==='checkbox')return el.checked;if(el.multiple)return [...el.selectedOptions].map(o=>o.value);return el.value;}
function write(el,value,fire=true){if(el.type==='checkbox'&&Array.isArray(value)){const values=new Set(value.map(normalize)),items=groupInputs(el);for(const input of items)input.checked=values.has(normalize(input.value));groupValidity(items);if(fire)el.dispatchEvent(new Event('change',{bubbles:true}));return;}if(el.type==='checkbox'){const flag=normalize(value)==='true'||normalize(value)==='on'||normalize(value)==='1';if(el.checked===flag)return;el.checked=flag;}else{const text=Array.isArray(value)?value.map(normalize):normalize(value);if(normalize(controlValue(el))===normalize(text))return;if(el.tomselect)el.tomselect.setValue(text,true);else if(el.multiple){const values=new Set(Array.isArray(text)?text:[text]);for(const option of el.options)option.selected=values.has(option.value);}else el.value=text;}if(fire){el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}}
function popup(message,controls,preview){const previous=document.activeElement,dialog=document.createElement('dialog');dialog.className='crm-behavior-dialog';dialog.setAttribute('aria-label',preview?'آزمایش رفتار گزینه':'راهنما و انتخاب');const header=document.createElement('header'),title=document.createElement('h2'),close=document.createElement('button'),body=document.createElement('div'),footer=document.createElement('footer');title.textContent=preview?'آزمایش رفتار گزینه':'راهنما و انتخاب';close.type='button';close.textContent='×';close.setAttribute('aria-label','بستن');header.append(title,close);body.className='body';body.append(document.createTextNode(message.text));const source=controls.get(message.target);let clone=null;
if(source){clone=source.cloneNode(true);clone.removeAttribute('id');clone.removeAttribute('name');clone.removeAttribute('required');clone.className='no-search';clone.disabled=false;clone.removeAttribute('data-behavior-name');clone.removeAttribute('hidden');clone.style.display='';clone.value=source.value;if(clone.type==='checkbox')clone.checked=source.checked;for(const el of [clone,...clone.querySelectorAll('*')])for(const attr of [...el.attributes])if(attr.name.startsWith('x-')||attr.name.startsWith('@')||attr.name.startsWith(':')||attr.name.startsWith('data-crm-')||attr.name==='data-jdp')el.removeAttribute(attr.name);if(clone.tagName==='SELECT'){const values=new Set(source.multiple?[...source.selectedOptions].map(o=>o.value):[source.value]);for(const option of clone.options)option.selected=values.has(option.value);}body.append(clone);}
const done=document.createElement('button');done.type='button';done.className='primary';done.textContent=clone?'اعمال انتخاب':'متوجه شدم';footer.append(done);dialog.append(header,body,footer);document.body.append(dialog);const dismiss=()=>{dialog.close();dialog.remove();previous?.focus?.();};close.addEventListener('click',dismiss);done.addEventListener('click',()=>{if(source&&clone)write(source,controlValue(clone));dismiss();});dialog.addEventListener('cancel',event=>{event.preventDefault();dismiss();});dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dismiss();}});dialog.showModal();done.focus();}
function bind(container,config,{preview=false}={}){const controls=new Map();for(const el of container.querySelectorAll('input,select,textarea')){const name=el.dataset.behaviorName||el.name;if(name&&config.fields.includes(name))controls.set(name,el);}if(!controls.size)return null;const originals=new Map([...controls].map(([key,el])=>[key,{required:el.required,options:el.tagName==='SELECT'?[...el.options].map(o=>({value:o.value,label:o.textContent,disabled:o.disabled})):null}]));let running=false,lastMatched=new Set(),disposed=false;const locked=new Set(config.locked||[]);container.dataset.behaviorReplace=String(!!config.replace);container._behaviorConfig=config;
const tags=document.createElement('div');tags.className='crm-behavior-labels';tags.setAttribute('aria-live','polite');tags.dataset.behaviorTags='';container.append(tags);
function run(announce=false){if(running||disposed)return;running=true;try{for(const el of container.querySelectorAll('input,select,textarea')){const name=el.dataset.behaviorName||el.name;if(config.fields.includes(name)&&(!controls.has(name)||controls.get(name).matches(':disabled')&&!el.matches(':disabled')))controls.set(name,el);}const input=Object.fromEntries([...controls].map(([name,el])=>[name,(config.multiple||[]).includes(name)&&el.type==='checkbox'?groupInputs(el).filter(input=>input.checked).map(input=>input.value):(config.booleans||[]).includes(name)&&el.type!=='checkbox'?['on','true','1'].includes(normalize(el.value)):controlValue(el)]));const rules=config.rules.filter(rule=>!(config.empty_locked||[]).includes(rule.target)||!['hide','optional','clear'].includes(rule.action)).filter(rule=>controls.has(rule.source)&&!controls.get(rule.source).matches(':disabled')&&(!rule.roles?.length||!config.role||rule.roles.includes(config.role)));const result=evaluate(input,rules);for(const target of new Set(rules.map(r=>r.target).filter(Boolean))){const el=controls.get(target);if(!el||locked.has(target)||el.matches(':disabled')&&!el.dataset.behaviorManagedDisabled)continue;if(el.dataset.behaviorManagedDisabled)el.disabled=false;const multiple=(config.multiple||[]).includes(target)&&el.type==='checkbox',items=multiple?groupInputs(el):[],group=multiple?commonGroup(items):groupFor(el),state=result.states[target]||{};group.toggleAttribute('data-behavior-hidden',state.visible===false);group.toggleAttribute('data-behavior-visible',state.visible===true);if(rules.some(r=>r.target===target&&['require','optional','show','hide'].includes(r.action))){const required=state.visible===false?false:state.required===undefined?((config.required_fields||[]).includes(target)||originals.get(target)?.required):state.required;if(multiple){for(const input of items)input.required=false;items[0].dataset.behaviorGroupRequired=String(!!required);groupValidity(items);}else el.required=required;}
const label=group.matches('label')?group:group.querySelector('label');if(label){let marker=label.querySelector('[data-behavior-required]')||[...label.querySelectorAll('span')].find(span=>span.textContent.trim()==='*');if(marker)marker.dataset.behaviorRequired='';if(!marker){marker=document.createElement('span');marker.dataset.behaviorRequired='';marker.style.color='#e1536c';marker.textContent=' *';label.append(marker);}marker.hidden=!el.required;for(const optional of label.querySelectorAll('.crm-optional'))optional.hidden=el.required;for(const star of label.querySelectorAll('.crm-required'))star.hidden=!el.required;}if(group.hasAttribute('data-crm-required'))group.dataset.crmRequired=String(el.required);
if(multiple&&rules.some(r=>r.target===target&&r.action==='choices')){for(const input of items){const allowed=!state.choices||state.choices.includes(input.value);const option=input.closest('label')||input.parentElement;option.toggleAttribute('data-behavior-hidden',!allowed);if(!allowed)input.checked=false;}groupValidity(items);}
if(originals.get(target).options&&rules.some(r=>r.target===target&&r.action==='choices')){const options=originals.get(target).options.filter(o=>!state.choices||state.choices.includes(o.value)||o.value==='');const signature=JSON.stringify(options);if(el.dataset.behaviorOptions!==signature){const val=el.value;if(el.tomselect){el.tomselect.clearOptions();el.tomselect.addOptions(options.map(o=>({value:o.value,text:o.label})));el.tomselect.setValue(options.some(o=>o.value===val)?val:'',true);}else{el.replaceChildren(...options.map(o=>{const item=new Option(o.label,o.value);item.disabled=o.disabled;return item;}));el.value=options.some(o=>o.value===val)?val:'';}el.dataset.behaviorOptions=signature;}}}
for(const name of new Set(rules.filter(r=>['set','clear'].includes(r.action)&&result.matched.includes(String(r.id))).map(r=>r.target))){const el=controls.get(name);if(el&&!locked.has(name)&&!el.matches(':disabled'))write(el,result.values[name]);}

tags.replaceChildren(...result.tags.filter(t=>!result.remove_tags.includes(t)).map(label=>{const badge=document.createElement('span');badge.className='crm-behavior-label';badge.textContent=label;return badge;}));lastMatched=new Set(result.matched);container.querySelector('[data-behavior-error]')?.remove();return result;
}catch(error){let notice=container.querySelector('[data-behavior-error]');if(!notice){notice=document.createElement('p');notice.className='crm-behavior-note';notice.dataset.behaviorError='';container.append(notice);}notice.textContent=error.message;}finally{running=false;}}
const event=e=>{if(e.target.matches('input,select,textarea'))run(true);};container.addEventListener('change',event);container.addEventListener('input',event);container.addEventListener('behavior:refresh',()=>run(false));run(false);return{run,dispose(){disposed=true;container.removeEventListener('change',event);container.removeEventListener('input',event);tags.remove();}};}
function prepare(){if(document.readyState==='loading')return;for(const script of document.querySelectorAll('script[data-form-behavior]:not([data-behavior-bound])')){const form=script.closest('form');if(!form)continue;script.dataset.behaviorBound='';try{const config=JSON.parse(script.textContent);bind(form,config);setTimeout(()=>form.dispatchEvent(new Event('behavior:refresh')),0);}catch(error){console.error('Invalid form behavior',error);}}}
window.CRMBehaviors={normalize,matches,evaluate,bind,showPopup:popup,canonical(form,name,value){return form?._behaviorConfig?.option_maps?.[name]?.[value]??value;}};

})();
