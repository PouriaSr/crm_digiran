{% if user.is_authenticated and 'hr.view_tasks' in user_permissions %}
<style>
.crm-task-launcher{position:fixed;left:18px;bottom:88px;z-index:1020;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #dbe3ef;border-radius:30px;padding:10px 14px;color:#334155;box-shadow:0 4px 18px #0f172a16;font-size:12px;min-height:44px}.crm-task-count{background:#2563eb;color:#fff;padding:2px 7px;border-radius:20px;min-width:22px}.crm-task-count:empty{display:none}.crm-task-dialog{width:min(520px,calc(100% - 24px));margin:auto;border:1px solid #e2e8f0;border-radius:18px;padding:0;color:#334155;max-height:85dvh;overflow:auto;box-shadow:0 24px 80px #0f172a30;direction:rtl}.crm-task-dialog::backdrop{background:#0f172a70;backdrop-filter:blur(2px)}.crm-task-dialog header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid #eef2f6;background:#fff;position:sticky;top:0;z-index:1}.crm-task-dialog h2{font-size:16px;font-weight:800}.crm-task-dialog header button{width:36px;height:36px;background:#f1f5f9;border-radius:10px;font-size:22px}.crm-task-body{padding:20px;font-size:13px;line-height:1.9}.crm-task-body p{overflow-wrap:anywhere}.crm-task-body textarea{display:block;width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font:inherit;min-height:130px;resize:vertical}.crm-task-body label{display:block;margin:18px 0 8px;font-weight:600;font-size:12px}.crm-task-summary{padding:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:14px}.crm-task-summary strong{display:block}.crm-task-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.crm-task-actions button,.crm-task-actions a{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border-radius:10px;border:1px solid #e2e8f0;background:#f8fafc;font-size:12px}.crm-task-actions button[type=submit]{background:#2563eb;color:#fff;border-color:#2563eb}.crm-task-dialog :is(button,a,textarea):focus-visible,.crm-task-launcher:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.crm-task-notice{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eef2f6;padding:12px 0;font-size:12px}.crm-task-notice a{color:#2563eb;min-height:36px;display:inline-flex;align-items:center;flex:none}.crm-task-toast{position:fixed;left:18px;bottom:146px;z-index:1020;max-width:min(330px,calc(100vw - 36px));padding:12px 16px;background:#1e293b;color:#fff;border-radius:12px;font-size:12px;line-height:1.9;box-shadow:0 6px 25px #0f172a20}.crm-task-toast[hidden]{display:none}.crm-task-error{color:#be123c;font-size:12px;line-height:1.8;margin-bottom:8px}.crm-task-error:empty{display:none}@media(max-width:600px){.crm-task-launcher{left:12px;bottom:82px;padding:9px 12px}.crm-task-body{padding:16px}.crm-task-dialog header{padding:14px 16px}}
</style>
<button type="button" class="crm-task-launcher" id="crm-task-launcher" aria-haspopup="dialog">وظایف من <span class="crm-task-count" id="crm-task-count"></span></button>
<div class="crm-task-toast" id="crm-task-toast" role="status" aria-live="polite" hidden></div>
<dialog class="crm-task-dialog" id="crm-task-inbox" aria-labelledby="crm-task-inbox-heading"><header><h2 id="crm-task-inbox-heading">اعلان‌های وظایف من</h2><button type="button" data-close-task-dialog aria-label="بستن">×</button></header><div class="crm-task-body"><div id="crm-task-items"></div><div class="crm-task-actions"><a href="{% url 'hr:task_list' %}">مشاهده فهرست وظایف</a></div></div></dialog>
<dialog class="crm-task-dialog" id="crm-task-report" aria-labelledby="crm-task-report-heading"><header><h2 id="crm-task-report-heading">گزارش انجام کار</h2><button type="button" data-close-task-dialog aria-label="بعداً ثبت می‌کنم">×</button></header><form class="crm-task-body" id="crm-task-report-form" method="post" data-crm-form data-live-search="off">{% csrf_token %}<div class="crm-task-summary"><strong id="crm-task-report-title"></strong><p id="crm-task-report-stage"></p></div><p id="crm-task-report-description"></p><label for="crm-task-report-text">توضیح انجام کار <span class="text-red-600" aria-label="الزامی">*</span></label><p class="crm-task-error" id="crm-task-report-error" role="alert"></p><textarea id="crm-task-report-text" name="text" required minlength="3" maxlength="4000" placeholder="چه کاری انجام شد و نتیجه آن چه بود؟"></textarea><div class="crm-task-actions"><button type="submit">ثبت گزارش</button><button type="button" data-close-task-dialog>بعداً ثبت می‌کنم</button></div></form></dialog>
<script>
(function(){'use strict';const endpoint='{% url "hr:task_inbox" %}',readEndpoint='{% url "hr:task_notice_read" %}',reportEndpoint='{% url "hr:task_report" 0 %}',canReport={% if 'hr.report_tasks' in user_permissions %}true{% else %}false{% endif %},userId='{{ user.pk }}';const launcher=document.getElementById('crm-task-launcher'),counter=document.getElementById('crm-task-count'),box=document.getElementById('crm-task-inbox'),dialog=document.getElementById('crm-task-report'),form=document.getElementById('crm-task-report-form'),textarea=document.getElementById('crm-task-report-text'),error=document.getElementById('crm-task-report-error'),toast=document.getElementById('crm-task-toast');let data={notices:[],reports:[]},active=null,busy=false,loading=false,timer=null,previousNotice=0,returnFocus=null,stopped=false;
const csrf=()=>form.querySelector('[name=csrfmiddlewaretoken]').value;
function message(text){toast.textContent=text;toast.hidden=false;setTimeout(()=>{toast.hidden=true;},6500);}
function snoozed(item){try{return Number(sessionStorage.getItem('crm-task-snooze:'+userId+':'+item.event)||0)>Date.now();}catch(_){return false;}}
function occupied(){return Array.from(document.querySelectorAll('dialog[open],.hr-overlay,[role=dialog]')).some(el=>el!==box&&el!==dialog&&el.checkVisibility());}
function openReport(item){if(!canReport||busy)return;active=item;returnFocus=document.activeElement;document.getElementById('crm-task-report-title').textContent=item.title;document.getElementById('crm-task-report-stage').textContent=item.event?'وضعیت عملیات: '+item.status+(item.when?' · '+new Intl.DateTimeFormat('fa-IR',{dateStyle:'short',timeStyle:'short',timeZone:'Asia/Tehran'}).format(new Date(item.when)):''):'پس از ثبت این گزارش، وظیفه دستی انجام‌شده خواهد شد.';document.getElementById('crm-task-report-description').textContent=item.description||'';textarea.value='';error.textContent='';if(box.open)box.close();dialog.showModal();setTimeout(()=>textarea.focus(),50);}
function maybeOpen(){if(dialog.open||box.open||occupied()||document.hidden)return;const item=data.reports.find(item=>!snoozed(item));if(item)openReport(item);}
function renderInbox(){const list=document.getElementById('crm-task-items');list.replaceChildren();for(const item of data.reports){const row=document.createElement('div');row.className='crm-task-notice';const title=document.createElement('span');title.textContent='گزارش در انتظار: '+item.title;const button=document.createElement('button');button.type='button';button.textContent='ثبت گزارش';button.className='text-blue-600';button.addEventListener('click',()=>openReport(item));row.append(title,button);list.append(row);}for(const item of data.notices){const row=document.createElement('div');row.className='crm-task-notice';const title=document.createElement('span');title.textContent=item.title;const link=document.createElement('a');link.href=item.url;link.textContent='مشاهده';link.addEventListener('click',()=>fetch(readEndpoint,{method:'POST',headers:{'X-CSRFToken':csrf(),'X-Requested-With':'XMLHttpRequest'},body:new URLSearchParams({notice:item.id}),keepalive:true}).catch(()=>{}));row.append(title,link);list.append(row);}if(!list.children.length){const empty=document.createElement('p');empty.textContent='اعلان یا گزارش ثبت‌نشده‌ای ندارید.';list.append(empty);}}
async function poll(){clearTimeout(timer);if(stopped)return;if(document.hidden||loading){timer=setTimeout(poll,12000);return;}loading=true;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);try{const response=await fetch(endpoint,{headers:{'X-Requested-With':'XMLHttpRequest','Accept':'application/json'},signal:controller.signal,cache:'no-store'});if(response.status===401||response.status===403){stopped=true;launcher.hidden=true;return;}if(!response.ok)throw new Error();data=await response.json();counter.textContent=data.unread+data.pending_reports?new Intl.NumberFormat('fa-IR').format(data.unread+data.pending_reports):'';const newest=data.notices[0]?.id||0;if(newest>previousNotice){if(previousNotice||data.unread)message(data.notices[0].title);previousNotice=newest;}renderInbox();maybeOpen();}catch(_){launcher.title='ارتباط با اعلان‌ها موقتاً برقرار نیست؛ دوباره تلاش می‌شود.';}finally{clearTimeout(timeout);loading=false;if(!stopped)timer=setTimeout(poll,12000);}}
launcher.addEventListener('click',()=>{renderInbox();returnFocus=launcher;box.showModal();poll();});document.querySelectorAll('[data-close-task-dialog]').forEach(button=>button.addEventListener('click',()=>button.closest('dialog').close()));dialog.addEventListener('close',()=>{if(active?.event){try{sessionStorage.setItem('crm-task-snooze:'+userId+':'+active.event,String(Date.now()+300000));}catch(_){}}active=null;returnFocus?.focus?.({preventScroll:true});});box.addEventListener('close',()=>returnFocus?.focus?.({preventScroll:true}));document.addEventListener('click',event=>{const button=event.target.closest('[data-manual-task-report]');if(button)openReport({task:button.dataset.manualTaskReport,title:button.dataset.taskTitle,event:null});});
form.addEventListener('submit',async event=>{event.preventDefault();if(busy||!active)return;error.textContent='';if(!textarea.checkValidity()){textarea.reportValidity();return;}busy=true;const button=form.querySelector('[type=submit]');button.disabled=true;try{const response=await fetch(reportEndpoint.replace('/0/','/'+active.task+'/'),{method:'POST',headers:{'X-CSRFToken':csrf(),'X-Requested-With':'XMLHttpRequest'},body:new URLSearchParams({text:textarea.value,event:active.event||''})});const result=await response.json();if(!response.ok){error.textContent=result.errors?.text?.map(item=>item.message).join(' ')||result.error||'ثبت گزارش انجام نشد؛ دوباره تلاش کنید.';textarea.focus();return;}data.reports=data.reports.filter(item=>item.event!==active.event);const completedTask=active.task;message(result.message);dialog.close();if(location.pathname.endsWith('/hr/tasks/'+completedTask+'/')){location.reload();return;}const row=document.querySelector('[data-feedback-record="task:'+completedTask+'"] [data-label="وضعیت"]');if(row)row.textContent=result.status;document.dispatchEvent(new CustomEvent('crm:task-reported',{detail:result}));poll();}catch(_){error.textContent='ارتباط برقرار نشد؛ متن گزارش حفظ شده است. دوباره ثبت کنید.';}finally{busy=false;button.disabled=false;}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});window.addEventListener('focus',poll);setTimeout(poll,600);window.CRMTaskInbox={refresh:poll};})();
</script>
{% endif %}
