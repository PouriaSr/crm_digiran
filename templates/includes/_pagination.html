{% load fa_numbers %}
{% if page.paginator.num_pages > 1 %}<nav class="crm-pagination flex flex-wrap items-center justify-between gap-3 p-4 text-sm border-t border-gray-100" aria-label="صفحه‌بندی {{ pagination_label|default:'فهرست' }}"><span>صفحه {{ page.number|fa_num }} از {{ page.paginator.num_pages|fa_num }} · {{ page.paginator.count|fa_num }} مورد</span><div class="flex gap-3">{% if page.has_previous %}<a class="wf-action text-blue-600" href="{% record_page_url page.page_key|default:'page' page.previous_page_number %}">قبلی</a>{% endif %}{% if page.has_next %}<a class="wf-action text-blue-600" href="{% record_page_url page.page_key|default:'page' page.next_page_number %}">بعدی</a>{% endif %}</div></nav>{% endif %}
