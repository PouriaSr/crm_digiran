<style>.crm-pages{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding:18px;border-top:1px solid #edf2f7;font-size:12px;color:#64748b}.crm-pages-links{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.crm-pages a,.crm-pages .crm-page-disabled,.crm-pages [aria-current=page]{display:inline-flex;align-items:center;justify-content:center;min-width:38px;min-height:40px;padding:6px 10px;border:1px solid #dce5ef;border-radius:9px;background:#fff;color:#2563eb;box-sizing:border-box;text-decoration:none}.crm-pages [aria-current=page]{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:700}.crm-pages .crm-page-disabled{color:#94a3b8;background:#f8fafc}.crm-page-jump{display:flex;align-items:center;gap:7px}.crm-page-jump input{width:75px;min-height:40px;border:1px solid #dce5ef;border-radius:9px;padding:6px;text-align:center}.crm-page-jump button{min-height:40px;padding:6px 12px;background:#eff6ff;border:1px solid #dbeafe;border-radius:9px;color:#1d4ed8}.crm-pages a:focus-visible,.crm-page-jump :focus-visible{outline:2px solid #60a5fa;outline-offset:2px}</style>
<script>(function(){if(window.CRMPages)return;window.CRMPages=true;function go(root){const field=root.querySelector('input');if(!field.reportValidity())return;const url=new URL(root.dataset.pageUrl,location.href);url.searchParams.set(root.dataset.pageKey,field.value);const link=document.createElement('a');link.href=url;link.hidden=true;root.append(link);link.click();link.remove();}document.addEventListener('click',event=>{const button=event.target.closest('[data-page-go]');if(button)go(button.closest('.crm-page-jump'));});document.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.closest('.crm-page-jump')){event.preventDefault();go(event.target.closest('.crm-page-jump'));}});})();</script>
