{% if messages %}<template data-feedback-queue>{% for message in messages %}<div class="crm-local-feedback" data-feedback-level="{{ message.level_tag }}" data-feedback-context="{{ message.extra_tags }}" role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}">{{ message }}</div>{% endfor %}</template><noscript>{% for message in messages %}<p role="status">{{ message }}</p>{% endfor %}</noscript>{% endif %}
