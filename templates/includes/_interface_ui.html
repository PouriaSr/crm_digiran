{{ interface_overrides|json_script:'crm-interface-settings' }}
<script>
(function(){
'use strict';
const rules=JSON.parse(document.getElementById('crm-interface-settings')?.textContent||'[]');if(!rules.length)return;
const definitions=new Map(rules.map(rule=>[rule.key,rule]));
function title(el,label){if(!label||el.dataset.crmAppliedLabel===label)return;if(el.matches('[x-text],[data-task-count],[data-task-news]'))return;
 const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode(node){return node.parentElement.closest('svg,script,style,select,input,textarea,[aria-hidden=true],[x-text],[data-task-count],[data-task-news],.wf-tab-count,.msg-section-num,.msg-channel-icon,.msg-channel small,.crm-required,.crm-optional,.text-red-500,.text-red-600')?NodeFilter.FILTER_REJECT:/[\p{L}]/u.test(node.textContent)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
 const texts=[];while(walker.nextNode())texts.push(walker.currentNode);if(texts.length){texts[0].textContent=label;}else if(!el.querySelector('input,select,textarea')){const text=document.createElement('span');text.textContent=label;el.append(text);}el.dataset.crmAppliedLabel=label;if(el.matches('button,a')&&el.hasAttribute('aria-label'))el.setAttribute('aria-label',label);}
function columns(table){const heads=Array.from(table.tHead?.rows[0]?.cells||[]);if(!heads.some(h=>definitions.has(h.dataset.crmUi)))return;
 const byIndex=heads.map((head,index)=>{if(!head.dataset.crmColumnIndex)head.dataset.crmColumnIndex=String(index+1);const config=definitions.get(head.dataset.crmUi);return{head,index:Number(head.dataset.crmColumnIndex)-1,position:config?.position??(Number(head.dataset.crmColumnIndex)*10),visible:config?.visible!==false,label:config?.label};});
 for(const body of table.tBodies)for(const row of body.rows){if(row.cells.length!==heads.length||Array.from(row.cells).some(cell=>cell.colSpan!==1))continue;for(const [i,cell]of Array.from(row.cells).entries())if(!cell.dataset.crmColumnIndex)cell.dataset.crmColumnIndex=heads[i].dataset.crmColumnIndex;for(const item of byIndex){const cell=Array.from(row.cells).find(cell=>Number(cell.dataset.crmColumnIndex)===item.index+1);cell.toggleAttribute('data-crm-config-hidden',!item.visible);if(item.label&&cell.hasAttribute('data-label'))cell.dataset.label=item.label;}}
 const ordered=[...byIndex].sort((a,b)=>a.position-b.position||a.index-b.index);
 for(const row of [table.tHead.rows[0],...Array.from(table.tBodies).flatMap(b=>Array.from(b.rows))]){if(row.cells.length!==heads.length||Array.from(row.cells).some(cell=>cell.colSpan!==1))continue;const cells=Array.from(row.cells);const sorted=ordered.map(item=>cells.find(cell=>Number(cell.dataset.crmColumnIndex)===item.index+1));if(sorted.every(Boolean)&&sorted.some((cell,i)=>cell!==cells[i]))row.append(...sorted);}
}
function apply(root=document){for(const el of [...(root.matches?.('[data-crm-ui]')?[root]:[]),...root.querySelectorAll('[data-crm-ui]')]){const rule=definitions.get(el.dataset.crmUi);if(!rule)continue;const mandatory=el.dataset.crmRequired==='true'||!!el.querySelector(':required,[aria-invalid=true],.crm-field-errors')||el.matches('label')&&(el.querySelector(':required')||document.getElementById(el.htmlFor)?.required);el.toggleAttribute('data-crm-config-hidden',rule.visible===false&&!mandatory);if(rule.order_changed){for(const sibling of el.parentElement.children)if(sibling.dataset.crmOrder&&!definitions.get(sibling.dataset.crmUi)?.order_changed)sibling.style.order=sibling.dataset.crmOrder;el.style.order=String(rule.position);}title(rule.kind==='field'&&el.matches('.crm-field,.crm-filter-field')?(el.querySelector('label')||el):el,rule.label);}
 for(const el of root.querySelectorAll('[data-crm-column-ref]')){const rule=definitions.get(el.dataset.crmColumnRef);if(!rule)continue;el.toggleAttribute('data-crm-config-hidden',!rule.visible);const heading=el.querySelector('dt,[data-crm-column-title]');if(heading)title(heading,rule.label);if(rule.order_changed)el.style.order=String(rule.position);}
 for(const table of root.querySelectorAll('table'))columns(table);
}
let queued=false;document.addEventListener('DOMContentLoaded',()=>apply());document.addEventListener('crm:results-updated',event=>apply(event.detail?.root||document));document.addEventListener('htmx:afterSwap',event=>apply(event.detail?.target||document));
new MutationObserver(records=>{if(!queued&&records.some(r=>r.type==='attributes'||Array.from(r.addedNodes).some(n=>n.nodeType===1&&(n.matches?.('[data-crm-ui],table')||n.querySelector?.('[data-crm-ui],table'))))){queued=true;requestAnimationFrame(()=>{queued=false;apply();});}}).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['aria-invalid','required']});window.CRMInterface={apply};
})();
</script><style>[data-crm-config-hidden]{display:none!important}.crm-custom-links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.crm-custom-links a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;background:#fff;border:1px solid #cbd5e1;border-radius:11px;color:#1d4ed8;font-size:13px;max-width:100%;overflow-wrap:anywhere}</style>
