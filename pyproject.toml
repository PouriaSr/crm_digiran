    "django-unfold>=0.108.0",
    "django-htmx>=1.29.0",
    "django-widget-tweaks>=1.5.1",
    "jdatetime>=6.1.0",
    "jalali-core>=1.0.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
    "django-otp>=1.7.5",
]

[tool.uv]
package = false
